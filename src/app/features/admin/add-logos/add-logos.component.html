<div class="container-fluid p-4">

  <!-- Title -->
  <h3 class="fw-bold mb-4">Add New Logo</h3>

  <div class="card shadow-sm border-0 p-4">

    <!-- Upload Box -->
    <div class="upload-box text-center mb-4">

      <input type="file" hidden #fileInput (change)="onFileSelect($event)">

      <div (click)="fileInput.click()">
        <i class="bi bi-cloud-upload fs-1 text-primary"></i>
        <p class="mt-2 mb-0">
          <span class="text-primary">Click to upload</span> or drag and drop
        </p>
        <small class="text-muted">
          SVG, PNG or JPG (max. 800×400px)
        </small>
      </div>

    </div>

    <!-- Inputs -->
    <div class="row g-3">

      <div class="col-md-6">
        <label class="form-label">Logo Name</label>
        <input type="text" class="form-control"
               [(ngModel)]="logoName">
      </div>

      <div class="col-md-6">
        <label class="form-label">Category</label>
        <select class="form-select"
                [(ngModel)]="category">
          <option value="">Select category</option>
          <option>Header</option>
          <option>Footer</option>
        </select>
      </div>

      <div class="col-12">
        <label class="form-label">Alt Text</label>
        <input type="text" class="form-control"
               [(ngModel)]="altText">
      </div>

    </div>

    <!-- Buttons -->
    <div class="d-flex justify-content-end mt-4 gap-2">
      <button class="btn btn-light border">Cancel</button>
      <button class="btn btn-primary" (click)="upload()">
        Upload Logo
      </button>
    </div>

  </div>

</div>
