<div class="container-fluid">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4 pt-4">
    <div>
      <h3 class="fw-bold">Store Details</h3>
      <span class="badge rounded-pill"
        [ngClass]="{
          'bg-success-subtle text-success': store.status === 'Approved',
          'bg-warning-subtle text-warning': store.status === 'Pending',
          'bg-danger-subtle text-danger': store.status === 'Banned'
        }">
        {{ store.status }}
      </span>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-success" (click)="approveStore()">
        Approve
      </button>
      <button class="btn btn-danger" (click)="banStore()">
        Ban
      </button>
    </div>
  </div>

  <div class="row g-3">

    <!-- Store Info -->
    <div class="col-md-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body">

          <h6 class="fw-bold mb-3">Store Information</h6>

          <p><strong>Name:</strong> {{ store.name }}</p>
          <p><strong>Created:</strong> {{ store.createdAt }}</p>

        </div>
      </div>
    </div>

    <!-- Contact -->
    <div class="col-md-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body">

          <h6 class="fw-bold mb-3">Contact Info</h6>

          <p>{{ store.email }}</p>
          <p>{{ store.phone }}</p>
          <p>{{ store.address }}</p>

        </div>
      </div>
    </div>

    <!-- Documents -->
    <div class="col-md-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body">

          <h6 class="fw-bold mb-3">Verification Documents</h6>

          <div *ngFor="let doc of store.documents"
               class="d-flex justify-content-between align-items-center mb-2">

            <span>{{ doc.name }}</span>
            <button class="btn btn-sm btn-light">View</button>

          </div>

        </div>
      </div>
    </div>

    <!-- History -->
    <div class="col-md-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body">

          <h6 class="fw-bold mb-3">Activation History</h6>

          <div *ngFor="let h of store.history" class="mb-2">
            <span [class]="h.color">{{ h.text }}</span>
          </div>

        </div>
      </div>
    </div>

  </div>
  <div class="modal fade" id="banModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Ban Store</h5>
      </div>

      <div class="modal-body">
        <textarea class="form-control" placeholder="Reason..."></textarea>

        <div class="mt-3 d-flex gap-2">
          <button class="btn btn-outline-secondary">1 Week</button>
          <button class="btn btn-outline-secondary">1 Month</button>
          <button class="btn btn-danger">Permanent</button>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-light">Cancel</button>
        <button class="btn btn-danger">Confirm Ban</button>
      </div>

    </div>
  </div>
</div>
</div>
