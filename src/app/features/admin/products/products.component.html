<div class="page-wrap">

  <div class="adm-header">
    <div>
      <h1 class="adm-title">Products</h1>
      <p class="adm-subtitle">Manage all products on the platform.</p>
    </div>
  </div>

  <div class="adm-toolbar">
    <div class="adm-search">
      <i class="bi bi-search adm-search-icon"></i>
      <input type="text" placeholder="Search by product name..." [(ngModel)]="searchTerm" (input)="applyFilter()">
    </div>
  </div>

  <div class="adm-table-card">
    <table class="adm-table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Audience</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products" [routerLink]="['/admin/products', product.id]" style="cursor:pointer">
          <td>
            <div class="cell-avatar">
              <img [src]="product.mainImageUrl || 'https://via.placeholder.com/40'" class="cell-img">
              <span class="cell-main">{{ product.name }}</span>
            </div>
          </td>
          <td><span class="adm-badge badge-info">{{ product.targetAudience || 'N/A' }}</span></td>
<td><span class="cell-main" style="color:#10b981">{{ product.price }} EGP</span></td>        </tr>
        <tr *ngIf="!products?.length" class="no-click">
          <td colspan="3"><div class="adm-empty"><i class="bi bi-box-seam"></i><p>No products found</p></div></td>
        </tr>
      </tbody>
    </table>

    <div class="adm-pagination">
      <span class="adm-pagination-info">Page {{ currentPage }}</span>
      <div class="adm-pager">
        <button class="adm-page-btn" (click)="prevPage()" [disabled]="currentPage === 1"><i class="bi bi-chevron-left"></i></button>
        <button class="adm-page-btn" *ngFor="let page of totalPages" [class.current]="page === currentPage" (click)="goToPage(page)">{{ page }}</button>
        <button class="adm-page-btn" (click)="nextPage()" [disabled]="currentPage === totalPages.length"><i class="bi bi-chevron-right"></i></button>
      </div>
    </div>
  </div>

</div>
