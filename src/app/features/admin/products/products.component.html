<div class="container-fluid">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4 pt-4">
    <div>
      <h2 class="fw-bold">Products 📦</h2>
      <p class="text-muted">Manage all products on the platform</p>
    </div>
  </div>

  <!-- Search -->
  <div class="card border-0 shadow-sm mb-3">
    <div class="card-body">
      <input
        type="text"
        class="form-control"
        placeholder="Search by product name or store..."
        [(ngModel)]="searchTerm"
        (input)="applyFilter()"
      />
    </div>
  </div>

  <!-- Table -->
  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table align-middle mb-0">

        <thead class="table-light">
          <tr>
            <th>Product</th>
            <th>Store</th>
            <th>Price</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let product of pagedProducts"
    style="cursor:pointer"
    [routerLink]="['/admin/products', product.id]">

            <td class="d-flex align-items-center gap-2">
              <img [src]="product.image"
                   class="rounded"
                   width="40"
                   height="40">

              <span class="fw-semibold">
                {{ product.name }}
              </span>
            </td>

            <td class="text-muted">
              {{ product.store }}
            </td>

            <td class="fw-semibold">
              ${{ product.price }}
            </td>

          </tr>
        </tbody>

      </table>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-between align-items-center p-3 border-top">

      <small class="text-muted">
        Showing {{ startIndex + 1 }}–{{ endIndex }} of {{ filteredProducts.length }}
      </small>

      <nav>
        <ul class="pagination mb-0">

          <li class="page-item" [class.disabled]="currentPage === 1">
            <button class="page-link" (click)="prevPage()">Prev</button>
          </li>

          <li class="page-item"
              *ngFor="let page of totalPages"
              [class.active]="page === currentPage">
            <button class="page-link" (click)="goToPage(page)">
              {{ page }}
            </button>
          </li>

          <li class="page-item"
              [class.disabled]="currentPage === totalPages.length">
            <button class="page-link" (click)="nextPage()">Next</button>
          </li>

        </ul>
      </nav>

    </div>
  </div>
</div>
