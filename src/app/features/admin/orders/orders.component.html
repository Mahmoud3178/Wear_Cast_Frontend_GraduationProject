<div class="container-fluid p-4">

  <!-- SEARCH -->
  <div class="card shadow-sm mb-4">
    <div class="card-body d-flex flex-wrap gap-2">

      <input class="form-control flex-grow-1"
             placeholder="Search by customer or vendor..."
             [(ngModel)]="searchTerm"
             (input)="onSearch()">

      <button class="btn btn-outline-primary" (click)="setStatus(null)">All</button>
      <button class="btn btn-outline-success" (click)="setStatus('Paid')">Paid</button>
      <button class="btn btn-outline-warning" (click)="setStatus('Ready')">Ready</button>
      <button class="btn btn-outline-danger" (click)="setStatus('Cancelled')">Cancelled</button>

    </div>
  </div>

  <!-- TABLE -->
  <div class="card shadow-sm">
    <div class="table-responsive">

      <table class="table table-hover align-middle mb-0">

        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Customer</th>
            <th>Vendor</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Items</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let order of orders"
              (click)="openDetails(order.id)"
              style="cursor:pointer">

            <td class="fw-bold">#{{order.id}}</td>

            <td>
              <div class="fw-semibold">{{order.recipientName}}</div>
              <small class="text-muted">{{order.recipientPhoneNumber}}</small>
            </td>

            <td>
              <div class="fw-semibold text-primary">
                {{order.vendorName}}
              </div>
              <small class="text-muted">
                {{order.vendorPhoneNumber}}
              </small>
            </td>

            <td>
              <span class="badge bg-info text-dark">
                {{order.orderType}}
              </span>
            </td>

            <td class="fw-bold text-success">
              {{order.totalAmount}} LE
            </td>

            <td>
              <span class="badge"
                    [ngClass]="{
                      'bg-success': order.status === 'Paid',
                      'bg-warning text-dark': order.status === 'Ready',
                      'bg-danger': order.status === 'Cancelled'
                    }">
                {{order.status}}
              </span>
            </td>

            <td>
              <span class="badge bg-dark">
                {{order.itemsCount}}
              </span>
            </td>

          </tr>

        </tbody>

      </table>

    </div>
  </div>

  <!-- PAGINATION -->
  <div class="d-flex justify-content-center mt-4"
       *ngIf="totalPages > 1">

    <ul class="pagination">

      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link"
                (click)="changePage(currentPage - 1)">
          «
        </button>
      </li>

      <li class="page-item"
          *ngFor="let p of [].constructor(totalPages); let i = index"
          [class.active]="currentPage === i + 1">

        <button class="page-link"
                (click)="changePage(i + 1)">
          {{ i + 1 }}
        </button>

      </li>

      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button class="page-link"
                (click)="changePage(currentPage + 1)">
          »
        </button>
      </li>

    </ul>

  </div>

</div>
