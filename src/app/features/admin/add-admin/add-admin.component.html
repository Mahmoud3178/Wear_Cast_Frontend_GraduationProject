<div class="page-wrap">

  <div class="adm-header">
    <div>
      <h1 class="adm-title">Add New Administrator</h1>
      <p class="adm-subtitle">Create a new admin account with role assignment.</p>
    </div>
  </div>

  <div class="adm-card" style="max-width:680px">
    <div class="adm-card-head">
      <h3 class="adm-card-title"><i class="bi bi-shield-lock"></i> Admin Information</h3>
    </div>
    <div class="adm-card-body">

      <div class="adm-section-label"><i class="bi bi-person"></i> Personal Info</div>
      <div class="adm-form-grid" style="margin-bottom:20px">
        <div class="adm-form-group">
          <label>First Name <span class="adm-req">*</span></label>
          <input class="adm-field" placeholder="First Name" [(ngModel)]="admin.firstName">
        </div>
        <div class="adm-form-group">
          <label>Last Name</label>
          <input class="adm-field" placeholder="Last Name" [(ngModel)]="admin.lastName">
        </div>
        <div class="adm-form-group">
          <label>Email <span class="adm-req">*</span></label>
          <input class="adm-field" type="email" placeholder="admin@wearcast.com" [(ngModel)]="admin.email">
        </div>
        <div class="adm-form-group">
          <label>Phone</label>
          <input class="adm-field" placeholder="+20 1xx xxx xxxx" [(ngModel)]="admin.phone">
        </div>
      </div>

      <div class="adm-section-label"><i class="bi bi-shield-check"></i> Role & Security</div>
      <div class="adm-form-grid">
        <div class="adm-form-group full">
          <label>Role <span class="adm-req">*</span></label>
          <select class="adm-field" [(ngModel)]="admin.role">
            <option value="">— Select Role —</option>
            <option>Editor</option>
            <option>Manager</option>
            <option>Super Admin</option>
          </select>
        </div>
        <div class="adm-form-group">
          <label>Password <span class="adm-req">*</span></label>
          <input type="password" class="adm-field" placeholder="••••••••" [(ngModel)]="admin.password">
        </div>
        <div class="adm-form-group">
          <label>Confirm Password <span class="adm-req">*</span></label>
          <input type="password" class="adm-field" placeholder="••••••••" [(ngModel)]="admin.confirmPassword">
        </div>
      </div>

      <div class="add-admin-footer">
        <button class="adm-btn-secondary" routerLink="/admin/admins">Cancel</button>
        <button class="adm-btn-primary">
          <i class="bi bi-plus-lg"></i> Add Admin
        </button>
      </div>

    </div>
  </div>

</div>
