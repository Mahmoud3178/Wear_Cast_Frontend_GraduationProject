<div class="container-fluid p-4">

  <!-- Title -->
  <div class="mb-3">
    <h4 class="fw-bold">Customer List</h4>
    <p class="text-muted">Manage, search, and filter all customer accounts.</p>
  </div>

  <!-- Search + Filters -->
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">

    <!-- Search -->
    <div class="input-group search-box">
      <span class="input-group-text bg-white border-end-0">
        🔍
      </span>
      <input type="text"
             class="form-control border-start-0"
             placeholder="Search by name or email..."
             [(ngModel)]="searchTerm">
    </div>

    <!-- Filters -->
    <div class="btn-group">
      <button class="btn btn-sm"
        [ngClass]="selectedFilter === 'all' ? 'btn-primary' : 'btn-outline-secondary'"
        (click)="setFilter('all')">
        All Customers
      </button>

      <button class="btn btn-sm"
        [ngClass]="selectedFilter === 'active' ? 'btn-primary' : 'btn-outline-secondary'"
        (click)="setFilter('active')">
        Active
      </button>

      <button class="btn btn-sm"
        [ngClass]="selectedFilter === 'suspended' ? 'btn-primary' : 'btn-outline-secondary'"
        (click)="setFilter('suspended')">
        Suspended
      </button>
    </div>
  </div>

  <!-- Table -->
  <div class="card shadow-sm">
    <div class="card-body p-0">

      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Customer Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Account Status</th>
            <th></th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let c of filteredCustomers()" style="cursor:pointer">

            <!-- Name + Image -->
            <td class="d-flex align-items-center gap-2"
                (click)="goToDetails(c.id)">
              <img [src]="c.image"
                   class="rounded-circle"
                   width="35"
                   height="35">
              {{c.name}}
            </td>

            <td (click)="goToDetails(c.id)">{{c.email}}</td>
            <td (click)="goToDetails(c.id)">{{c.phone}}</td>

            <!-- Status -->
            <td (click)="goToDetails(c.id)">
              <span class="badge px-3 py-1"
                [ngClass]="c.status === 'Active'
                  ? 'bg-success-subtle text-success'
                  : 'bg-warning-subtle text-warning'">
                {{c.status}}
              </span>
            </td>

            <!-- Actions -->
            <td class="text-end">
              <div class="dropdown">
                <button class="btn btn-sm" data-bs-toggle="dropdown">
                  ⋮
                </button>

                <ul class="dropdown-menu">
                  <li>
                    <button class="dropdown-item">Edit</button>
                  </li>
                  <li>
                    <button class="dropdown-item text-danger">Delete</button>
                  </li>
                </ul>
              </div>
            </td>

          </tr>
        </tbody>

      </table>

    </div>
  </div>

  <!-- Footer -->
  <div class="d-flex justify-content-between mt-3">
    <small class="text-muted">
      Showing {{filteredCustomers().length}} of {{customers.length}}
    </small>

    <div>
      <button class="btn btn-outline-secondary btn-sm">Previous</button>
      <button class="btn btn-outline-secondary btn-sm">Next</button>
    </div>
  </div>

</div>
