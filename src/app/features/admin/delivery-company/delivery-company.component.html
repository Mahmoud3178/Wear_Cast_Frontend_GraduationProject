<div class="container-fluid p-4">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold">Delivery Company 🚚</h3>
      <p class="text-muted">Manage delivery company profile</p>
    </div>

    <div class="d-flex gap-2">
<button class="btn btn-primary"
        (click)="openCompanyModal()"
        [disabled]="company">
  + Add Company
</button>
      <button class="btn btn-outline-primary" (click)="toggleEdit()">
        {{ editMode ? 'Cancel' : 'Edit' }}
      </button>

      <button class="btn btn-success" *ngIf="editMode" (click)="save()">
        Save
      </button>

      <button class="btn btn-danger" (click)="deleteCompany()">
        Delete
      </button>
    </div>
  </div>
 <!-- MODAL -->
  <div class="modal fade show d-block" *ngIf="showCompanyModal">
    <div class="modal-dialog modal-xl">
      <div class="modal-content shadow-lg rounded-4">

        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title">🚚 Add Delivery Company</h5>
          <button class="btn-close btn-close-white" (click)="closeAddModal()"></button>
        </div>

        <div class="modal-body">

          <div class="row g-3">

            <!-- COMPANY INFO -->
            <div class="col-12">
              <h6 class="text-primary">Company Info</h6>
            </div>

            <div class="col-md-4">
              <input class="form-control" placeholder="Name" [(ngModel)]="form.name">
            </div>

            <div class="col-md-4">
              <input class="form-control" placeholder="Email" [(ngModel)]="form.email">
            </div>

            <div class="col-md-4">
              <input class="form-control" placeholder="Phone" [(ngModel)]="form.phoneNumber">
            </div>

            <div class="col-md-4">
              <input class="form-control" placeholder="Delivery Fee" [(ngModel)]="form.deliveryFee">
            </div>

            <!-- ✅ REQUIRED FIELDS ADDED -->
            <div class="col-md-4">
              <input class="form-control" placeholder="Commercial Register Number"
                     [(ngModel)]="form.commercialRegisterNumber">
            </div>

            <div class="col-md-4">
              <input class="form-control" placeholder="Tax ID Number"
                     [(ngModel)]="form.taxIdNumber">
            </div>

            <div class="col-md-12">
              <textarea class="form-control" placeholder="Description"
                        [(ngModel)]="form.description"></textarea>
            </div>

            <!-- ADDRESS -->
            <div class="col-md-4">
              <input class="form-control" placeholder="State"
                     [(ngModel)]="form.state">
            </div>

            <div class="col-md-4">
              <input class="form-control" placeholder="City"
                     [(ngModel)]="form.city">
            </div>

            <div class="col-md-4">
              <input class="form-control" placeholder="Street"
                     [(ngModel)]="form.street">
            </div>

            <div class="col-md-4">
              <input class="form-control" placeholder="Building"
                     [(ngModel)]="form.buildingNumber">
            </div>

            <hr>

            <!-- MANAGER -->
            <div class="col-12">
              <h6 class="text-success">Manager Info</h6>
            </div>

            <div class="col-md-4">
              <input class="form-control" placeholder="First Name"
                     [(ngModel)]="form.managerFirstName">
            </div>

            <div class="col-md-4">
              <input class="form-control" placeholder="Last Name"
                     [(ngModel)]="form.managerLastName">
            </div>

            <div class="col-md-4">
              <input class="form-control" placeholder="Email"
                     [(ngModel)]="form.managerEmail">
            </div>

            <div class="col-md-4">
              <input class="form-control" placeholder="Phone"
                     [(ngModel)]="form.managerPhone">
            </div>

            <div class="col-md-4">
              <input type="password" class="form-control" placeholder="Password"
                     [(ngModel)]="form.password">
            </div>

            <div class="col-md-4">
              <input type="password" class="form-control" placeholder="Confirm Password"
                     [(ngModel)]="form.confirmPassword">
            </div>

            <div class="col-md-6">
              <input type="file" class="form-control" (change)="onFileChange($event)">
            </div>

          </div>

        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" (click)="closeAddModal()">Close</button>
          <button class="btn btn-success px-4" (click)="addCompany()">Create</button>
        </div>

      </div>
    </div>
  </div>
  <!-- LOADING -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
  </div>

  <div *ngIf="!loading && company">

    <div class="row g-4">

      <!-- LEFT SIDE -->
      <div class="col-md-4">

        <div class="card border-0 shadow-sm text-center p-3">

          <img [src]="company.logoUrl"
               class="company-logo mb-3">

          <h5 class="fw-bold">{{ company.name }}</h5>

          <p class="text-muted">{{ company.email }}</p>
          <p class="text-muted">{{ company.phoneNumber }}</p>

          <!-- UPLOAD -->
          <div *ngIf="editMode">
            <input type="file" class="form-control mb-2" (change)="onFileChange($event)">
            <button class="btn btn-sm btn-dark w-100" (click)="uploadLogo()">
              Upload Logo
            </button>
          </div>

        </div>

      </div>

      <!-- RIGHT SIDE -->
      <div class="col-md-8">

        <div class="card border-0 shadow-sm p-3">

          <h5 class="fw-bold mb-3">Company Info</h5>

          <div class="row g-3">

            <div class="col-md-6">
              <label>Name</label>
              <input class="form-control" [(ngModel)]="form.name" [disabled]="!editMode">
            </div>

            <div class="col-md-6">
              <label>Email</label>
              <input class="form-control" [(ngModel)]="form.email" [disabled]="!editMode">
            </div>

            <div class="col-md-6">
              <label>Phone</label>
              <input class="form-control" [(ngModel)]="form.phoneNumber" [disabled]="!editMode">
            </div>

            <div class="col-md-6">
              <label>Delivery Fee</label>
              <input type="number" class="form-control" [(ngModel)]="form.deliveryFee" [disabled]="!editMode">
            </div>

            <div class="col-md-6">
              <label>Commercial Reg</label>
              <input class="form-control" [(ngModel)]="form.commercialRegisterNumber" [disabled]="!editMode">
            </div>

            <div class="col-md-6">
              <label>Tax ID</label>
              <input class="form-control" [(ngModel)]="form.taxIdNumber" [disabled]="!editMode">
            </div>

            <div class="col-md-12">
              <label>Description</label>
              <textarea class="form-control" rows="3"
                        [(ngModel)]="form.description"
                        [disabled]="!editMode"></textarea>
            </div>

          </div>

        </div>

        <!-- ADDRESS -->
        <div class="card border-0 shadow-sm p-3 mt-3">

          <h5 class="fw-bold mb-3">Address</h5>

          <div class="row g-3">

            <div class="col-md-6">
              <label>State</label>
              <input class="form-control" [(ngModel)]="form.state" [disabled]="!editMode">
            </div>

            <div class="col-md-6">
              <label>City</label>
              <input class="form-control" [(ngModel)]="form.city" [disabled]="!editMode">
            </div>

            <div class="col-md-6">
              <label>Street</label>
              <input class="form-control" [(ngModel)]="form.street" [disabled]="!editMode">
            </div>

            <div class="col-md-6">
              <label>Building</label>
              <input class="form-control" [(ngModel)]="form.buildingNumber" [disabled]="!editMode">
            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
