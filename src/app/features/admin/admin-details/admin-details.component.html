<div class="page-wrap">

  <div class="adm-header">
    <div>
      <h1 class="adm-title">Admin Details</h1>
      <p class="adm-subtitle">Update admin account information</p>
    </div>
  </div>

  <div class="adm-card" style="max-width:640px">
    <div class="adm-card-head">
      <h3 class="adm-card-title"><i class="bi bi-shield-lock"></i> Account Info</h3>
    </div>
    <div class="adm-card-body">
      <div class="adm-form-grid">
        <div class="adm-form-group">
          <label>First Name <span class="adm-req">*</span></label>
          <input class="adm-field" placeholder="First name" [(ngModel)]="admin.firstName">
        </div>
        <div class="adm-form-group">
          <label>Last Name</label>
          <input class="adm-field" placeholder="Last name" [(ngModel)]="admin.lastName">
        </div>
        <div class="adm-form-group">
          <label>Email <span class="adm-req">*</span></label>
          <input class="adm-field" type="email" placeholder="Email" [(ngModel)]="admin.email">
        </div>
        <div class="adm-form-group">
          <label>Phone</label>
          <input class="adm-field" placeholder="Phone" [(ngModel)]="admin.phoneNumber">
        </div>
        <div class="adm-form-group full">
          <label>Role <span class="adm-req">*</span></label>
          <select class="adm-field" [(ngModel)]="admin.role">
            <option>SuperAdmin</option>
            <option>OperationsAdmin</option>
            <option>CustomerServiceAdmin</option>
            <option>VendorAdmin</option>
            <option>CatalogAdmin</option>
          </select>
        </div>
      </div>
      <div style="margin-top:20px">
        <button class="adm-btn-primary" (click)="update()">
          <i class="bi bi-check2"></i> Save Changes
        </button>
      </div>
    </div>
  </div>

</div>
