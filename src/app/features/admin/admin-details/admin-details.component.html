<div class="container py-4">

  <h3 class="fw-bold mb-4">Admin Details</h3>

  <div class="card shadow-sm border-0 p-4">

    <div class="row g-3">

      <!-- First -->
      <div class="col-md-6">
        <label class="form-label">First Name</label>
        <input class="form-control" [(ngModel)]="admin.firstName">
      </div>

      <!-- Last -->
      <div class="col-md-6">
        <label class="form-label">Last Name</label>
        <input class="form-control" [(ngModel)]="admin.lastName">
      </div>

      <!-- Email -->
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input class="form-control" [(ngModel)]="admin.email">
      </div>

      <!-- Phone -->
      <div class="col-md-6">
        <label class="form-label">Phone</label>
        <input class="form-control" [(ngModel)]="admin.phoneNumber">
      </div>

      <!-- Role -->
      <div class="col-md-6">
        <label class="form-label">Role</label>

        <select class="form-select" [(ngModel)]="admin.role">
          <option>SuperAdmin</option>
          <option>OperationsAdmin</option>
          <option>CustomerServiceAdmin</option>
          <option>VendorAdmin</option>
          <option>CatalogAdmin</option>
        </select>

      </div>

    </div>

    <!-- BUTTON -->
    <div class="mt-4">
      <button class="btn btn-primary w-100" (click)="update()">
        Save Changes
      </button>
    </div>

  </div>

</div>
