<div class="container-fluid p-4">

  <!-- HEADER -->
  <h2 class="fw-bold mb-4">Dashboard</h2>

  <!-- 🔥 COMMISSION -->
  <div class="card shadow-sm p-3 mb-4">

    <label class="fw-bold mb-2">
      Commission Percentage Per Product (%)
    </label>

    <div class="d-flex gap-2 align-items-center">

      <input type="number"
             class="form-control w-25"
             [(ngModel)]="commission">

      <button class="btn btn-success"
              (click)="saveCommission()"
              [disabled]="loadingCommission">

        <span *ngIf="!loadingCommission">Save</span>
        <span *ngIf="loadingCommission" class="spinner-border spinner-border-sm"></span>

      </button>

    </div>

  </div>

  <!-- 🔥 STATS -->
  <div class="row g-3 mb-4">

    <div class="col-md-3 col-lg-3" *ngFor="let stat of stats">

      <div class="card shadow-sm stat-card">

        <div class="card-body d-flex gap-3 align-items-center">

          <i class="bi fs-3 text-{{stat.color}}" [ngClass]="stat.icon"></i>

          <div>
            <small class="text-muted">{{stat.title}}</small>
            <h5 class="fw-bold">{{stat.value}}</h5>
          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- 🔥 EXTRA -->
  <div class="row g-3 mb-4">

    <div class="col-md-6">
<div class="card p-3 shadow-sm d-flex align-items-center gap-3 flex-row">

  <i class="bi bi-graph-up-arrow fs-2 text-success"></i>

  <div>
    <h6 class="mb-0">Platform Revenue</h6>
    <h4 class="mb-0">{{data?.platformRevenue}} LE</h4>
  </div>

</div>
    </div>

    <div class="col-md-6">
<div class="card p-3 shadow-sm d-flex align-items-center gap-3 flex-row">

  <i class="bi bi-person-badge fs-2 text-primary"></i>

  <div>
    <h6 class="mb-0">Drivers</h6>
    <h4 class="mb-0">{{data?.totalDrivers}}</h4>
  </div>

</div>
    </div>

  </div>

  <!-- 🔥 CHARTS -->
  <div class="row g-4">

    <div class="col-md-6">
      <div class="card p-3 shadow-sm">
        <h6>Orders Distribution</h6>
        <canvas id="lineChart"></canvas>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card p-3 shadow-sm">
        <h6>Users</h6>
        <canvas id="barChart"></canvas>
      </div>
    </div>

  </div>

</div>
