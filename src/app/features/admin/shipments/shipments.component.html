<div class="page-wrap">

  <div class="adm-header">
    <div>
      <h1 class="adm-title">Shipments</h1>
      <p class="adm-subtitle">Track and manage all shipments.</p>
    </div>
  </div>

  <div class="adm-table-card">
    <table class="adm-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Customer</th>
          <th>Status</th>
          <th>Price</th>
          <th>Orders</th>
          <th>City</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of shipments" (click)="goToDetails(s.id)" style="cursor:pointer">
          <td><span class="cell-main">#{{s.id}}</span></td>
          <td><span class="cell-main">{{s.customerName}}</span></td>
          <td>
            <span class="adm-badge badge-pending">{{s.shipmentStatus}}</span>
          </td>
          <td><span class="cell-main" style="color:#10b981">{{s.price}} EGP</span></td>
          <td><span class="adm-badge badge-dark">{{s.numberOfOrders}}</span></td>
          <td class="cell-muted">{{s.deliveryCity}}</td>
          <td class="cell-muted">{{s.orderTime | date:'mediumDate'}}</td>
        </tr>
        <tr *ngIf="!shipments?.length" class="no-click">
          <td colspan="7"><div class="adm-empty"><i class="bi bi-truck"></i><p>No shipments found</p></div></td>
        </tr>
      </tbody>
    </table>

    <div class="adm-pagination">
      <span class="adm-pagination-info">Page {{pageIndex}} / {{totalPages}}</span>
      <div class="adm-pager">
        <button class="adm-page-btn" (click)="prev()" [disabled]="pageIndex === 1"><i class="bi bi-chevron-left"></i></button>
        <button class="adm-page-btn" (click)="next()" [disabled]="pageIndex === totalPages"><i class="bi bi-chevron-right"></i></button>
      </div>
    </div>
  </div>

</div>
