<div class="container-fluid">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4 pt-4">
    <div>
      <h2 class="fw-bold">Store List 🏬</h2>
      <p class="text-muted">Manage all stores on the platform</p>
    </div>
  </div>

  <!-- Search -->
  <div class="card border-0 shadow-sm mb-3">
    <div class="card-body">
      <input
        type="text"
        class="form-control"
        placeholder="Search by store name..."
        [(ngModel)]="searchTerm"
        (input)="applyFilters()"
      />
    </div>
  </div>

  <!-- Filters
  <div class="d-flex gap-2 mb-3">
    <button class="btn btn-sm rounded-pill"
            [ngClass]="activeFilter === 'All' ? 'btn-primary' : 'btn-outline-secondary'"

      All

    <button class="btn btn-sm rounded-pill"

    <button class="btn btn-sm rounded-pill"

    <button class="btn btn-sm rounded-pill"

      Banned
    </button>
  </div> -->

  <!-- Table -->
  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table align-middle mb-0">
<thead class="table-light">
  <tr>
    <th>Store</th>
    <th>Email</th>
    <th>Phone</th>
    <th>City</th>
    <th class="text-end">Action</th>
  </tr>
</thead>

<tbody>
<tr *ngFor="let store of stores">

  <td class="fw-semibold d-flex align-items-center gap-2">
    <img [src]="store.logoUrl"
         width="40"
         height="40"
         class="rounded-circle object-fit-cover">

    {{ store.name }}
  </td>

  <td class="text-muted">
    {{ store.email }}
  </td>

  <td>
    {{ store.phoneNumber }}
  </td>

  <td>
    {{ store.city }}
  </td>

  <td>
    <button
      class="btn btn-sm btn-light"
      [routerLink]="[store.id]">
      See Details
    </button>
  </td>

</tr>
</tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-between align-items-center p-3 border-top">
      <small class="text-muted">
Showing {{ (currentPage - 1) * pageSize + 1 }}
– {{ (currentPage * pageSize) }}
of {{ totalCount }}      </small>

      <nav>
        <ul class="pagination mb-0">

          <li class="page-item" [class.disabled]="currentPage === 1">
            <button class="page-link" (click)="prevPage()">Prev</button>
          </li>

          <li class="page-item"
              *ngFor="let page of totalPages"
              [class.active]="page === currentPage">
            <button class="page-link" (click)="goToPage(page)">
              {{ page }}
            </button>
          </li>

          <li class="page-item"
              [class.disabled]="currentPage === totalPages.length">
            <button class="page-link" (click)="nextPage()">Next</button>
          </li>

        </ul>
      </nav>
    </div>

  </div>
</div>
