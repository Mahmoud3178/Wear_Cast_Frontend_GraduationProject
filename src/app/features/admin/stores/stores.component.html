<div class="container-fluid">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4 pt-4">
    <div>
      <h2 class="fw-bold">Store List 🏬</h2>
      <p class="text-muted">Manage all stores on the platform</p>
    </div>
  </div>

  <!-- Search -->
  <div class="card border-0 shadow-sm mb-3">
    <div class="card-body">
      <input
        type="text"
        class="form-control"
        placeholder="Search by store name..."
        [(ngModel)]="searchTerm"
        (input)="applyFilters()"
      />
    </div>
  </div>

  <!-- Filters -->
  <div class="d-flex gap-2 mb-3">
    <button class="btn btn-sm rounded-pill"
            [ngClass]="activeFilter === 'All' ? 'btn-primary' : 'btn-outline-secondary'"
            (click)="setFilter('All')">
      All
    </button>

    <button class="btn btn-sm rounded-pill"
            [ngClass]="activeFilter === 'Pending' ? 'btn-warning' : 'btn-outline-secondary'"
            (click)="setFilter('Pending')">
      Pending
    </button>

    <button class="btn btn-sm rounded-pill"
            [ngClass]="activeFilter === 'Approved' ? 'btn-success' : 'btn-outline-secondary'"
            (click)="setFilter('Approved')">
      Approved
    </button>

    <button class="btn btn-sm rounded-pill"
            [ngClass]="activeFilter === 'Banned' ? 'btn-danger' : 'btn-outline-secondary'"
            (click)="setFilter('Banned')">
      Banned
    </button>
  </div>

  <!-- Table -->
  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Store Name</th>
            <th>Email</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let store of pagedStores">

            <td class="fw-semibold">
              {{ store.name }}
            </td>

            <td class="text-muted">
              {{ store.email }}
            </td>

            <td>
              <span class="badge rounded-pill"
                [ngClass]="{
                  'bg-success-subtle text-success': store.status === 'Approved',
                  'bg-warning-subtle text-warning': store.status === 'Pending',
                  'bg-danger-subtle text-danger': store.status === 'Banned'
                }">
                {{ store.status }}
              </span>
            </td>
<td>
<button class="btn btn-sm btn-light"
        [routerLink]="[store.id]">
  See Details
</button>
</td>

          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-between align-items-center p-3 border-top">
      <small class="text-muted">
        Showing {{ startIndex + 1 }}–{{ endIndex }} of {{ filteredStores.length }}
      </small>

      <nav>
        <ul class="pagination mb-0">

          <li class="page-item" [class.disabled]="currentPage === 1">
            <button class="page-link" (click)="prevPage()">Prev</button>
          </li>

          <li class="page-item"
              *ngFor="let page of totalPages"
              [class.active]="page === currentPage">
            <button class="page-link" (click)="goToPage(page)">
              {{ page }}
            </button>
          </li>

          <li class="page-item"
              [class.disabled]="currentPage === totalPages.length">
            <button class="page-link" (click)="nextPage()">Next</button>
          </li>

        </ul>
      </nav>
    </div>

  </div>
</div>
