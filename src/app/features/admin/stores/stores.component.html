<div class="page-wrap">

  <div class="adm-header">
    <div>
      <h1 class="adm-title">Stores</h1>
      <p class="adm-subtitle">Manage all stores on the platform.</p>
    </div>
  </div>

  <div class="adm-toolbar">
    <div class="adm-search">
      <i class="bi bi-search adm-search-icon"></i>
      <input type="text" placeholder="Search by store name..." [(ngModel)]="searchTerm" (input)="applyFilters()">
    </div>
  </div>

  <div class="adm-table-card">
    <table class="adm-table">
      <thead>
        <tr>
          <th>Store</th>
          <th>Email</th>
          <th>Phone</th>
          <th>City</th>
          <th style="text-align:right">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let store of stores" style="cursor:pointer" [routerLink]="[store.id]">
          <td>
            <div class="cell-avatar">
              <img [src]="store.logoUrl" class="cell-img-circle"
                   onerror="this.src='https://ui-avatars.com/api/?name=S&background=6366f1&color=fff&size=40'">
              <span class="cell-main">{{ store.name }}</span>
            </div>
          </td>
          <td class="cell-muted">{{ store.email }}</td>
          <td class="cell-muted">{{ store.phoneNumber }}</td>
          <td class="cell-muted">{{ store.city }}</td>
          <td style="text-align:right">
            <button class="adm-action-btn act-view" [routerLink]="[store.id]" (click)="$event.stopPropagation()" title="View">
              <i class="bi bi-eye"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="!stores?.length" class="no-click">
          <td colspan="5"><div class="adm-empty"><i class="bi bi-shop"></i><p>No stores found</p></div></td>
        </tr>
      </tbody>
    </table>

    <div class="adm-pagination">
      <span class="adm-pagination-info">
        Showing {{ (currentPage - 1) * pageSize + 1 }}–{{ currentPage * pageSize }} of {{ totalCount }}
      </span>
      <div class="adm-pager">
        <button class="adm-page-btn" (click)="prevPage()" [disabled]="currentPage === 1"><i class="bi bi-chevron-left"></i></button>
        <button class="adm-page-btn" *ngFor="let page of totalPages" [class.current]="page === currentPage" (click)="goToPage(page)">{{ page }}</button>
        <button class="adm-page-btn" (click)="nextPage()" [disabled]="currentPage === totalPages.length"><i class="bi bi-chevron-right"></i></button>
      </div>
    </div>
  </div>

</div>
