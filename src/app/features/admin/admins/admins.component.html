<div class="container-fluid p-4">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold">Admins List</h3>
      <p class="text-muted">Manage platform administrators</p>
    </div>

    <button class="btn btn-primary" (click)="toggleAdd()">
      + Add New Admin
    </button>
  </div>

  <!-- TABLE -->
  <div class="card shadow-sm">
    <table class="table mb-0">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th></th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let admin of admins">

          <td>{{admin.fullName}}</td>
          <td>{{admin.email}}</td>
          <td>{{admin.role}}</td>

          <td class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-primary"
                    (click)="goToDetails(admin.id)">
              Details
            </button>

            <button class="btn btn-sm btn-danger"
                    [disabled]="admin.role === 'SuperAdmin'"
                    (click)="deleteAdmin(admin.id)">
              Delete
            </button>
          </td>

        </tr>
      </tbody>
    </table>
  </div>

</div>

<!-- DRAWER -->
<div class="drawer" [class.open]="showAdd">

  <div class="drawer-content">

    <h5 class="mb-3">Add Admin</h5>

    <input class="form-control mb-2" placeholder="First Name"
           [(ngModel)]="newAdmin.firstName" autocomplete="off">

    <input class="form-control mb-2" placeholder="Last Name"
           [(ngModel)]="newAdmin.lastName" autocomplete="off">

    <input class="form-control mb-2" placeholder="Email"
           [(ngModel)]="newAdmin.email" autocomplete="off">

    <input class="form-control mb-2" placeholder="Phone"
           [(ngModel)]="newAdmin.phoneNumber" autocomplete="off">

    <input type="password" class="form-control mb-2"
           placeholder="Password"
           [(ngModel)]="newAdmin.password" autocomplete="off">

    <input type="password" class="form-control mb-2"
           placeholder="Confirm Password"
           [(ngModel)]="newAdmin.confirmPassword" autocomplete="off">

    <select class="form-control mb-3"
            [(ngModel)]="newAdmin.role">

      <option value="">Select Role</option>
      <option>SuperAdmin</option>
      <option>OperationsAdmin</option>
      <option>CustomerServiceAdmin</option>
      <option>VendorAdmin</option>
      <option>CatalogAdmin</option>

    </select>

    <div class="d-flex gap-2">
      <button class="btn btn-success w-100" (click)="addAdmin()">Save</button>
      <button class="btn btn-secondary w-100" (click)="toggleAdd()">Cancel</button>
    </div>

  </div>

</div>
