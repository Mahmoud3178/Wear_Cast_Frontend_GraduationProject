<div class="container-fluid p-4">

  <!-- 🔝 Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold">Logos Management</h3>
      <p class="text-muted mb-0">
        Organize brand assets, partner logos, and website icons.
      </p>
    </div>

    <div class="d-flex gap-2">
      <input type="text" class="form-control" placeholder="Search logos..." style="width: 250px;">
      <a routerLink="/admin/add-logos" class="btn btn-primary">
        + Add New Logo
      </a>
    </div>
  </div>

  <!-- Filters -->
  <div class="card p-3 mb-4 border-0 shadow-sm d-flex flex-row justify-content-between">
    <div>
      <label class="me-2">Filter by Category:</label>
      <select class="form-select d-inline w-auto">
        <option>All Categories</option>
      </select>
    </div>

    <div>
      <label class="me-2">Sort by:</label>
      <select class="form-select d-inline w-auto">
        <option>Newest Uploads</option>
      </select>
    </div>
  </div>

  <!-- Grid -->
  <div class="row g-4">

    <div class="col-md-3" *ngFor="let logo of logos">
      <div class="card shadow-sm border-0 p-3 h-100 logo-card">

        <!-- Status -->
        <div class="text-end">
          <span class="badge"
                [ngClass]="logo.status === 'Active' ? 'bg-success' : 'bg-secondary'">
            {{logo.status}}
          </span>
        </div>

        <!-- Logo Preview -->
        <div class="text-center my-4">
          <div class="logo-placeholder"></div>
        </div>

        <!-- Info -->
        <h6 class="fw-bold">{{logo.name}}</h6>
        <small class="text-muted">{{logo.file}}</small>

        <!-- Tags -->
        <div class="mt-2">
          <span class="badge bg-light text-dark me-1"
                *ngFor="let tag of logo.tags">
            {{tag}}
          </span>
        </div>

        <!-- Size -->
        <div class="mt-auto text-muted small mt-3">
          {{logo.size}}
        </div>

      </div>
    </div>

  </div>

</div>
