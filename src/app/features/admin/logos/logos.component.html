<div class="page-wrap">

  <div class="adm-header">
    <div>
      <h1 class="adm-title">Logos</h1>
      <p class="adm-subtitle">Manage and organize logo assets for the platform.</p>
    </div>
    <a routerLink="/admin/add-logos" class="adm-btn-primary">
      <i class="bi bi-plus-lg"></i> Add Logo
    </a>
  </div>

  <!-- Category filter pills -->
  <div class="logo-cats">
    <button class="logo-cat-btn" [class.active]="selectedCategory===null"
      (click)="selectedCategory=null; onCategoryChange()">
      <i class="bi bi-grid-3x3-gap"></i> All
    </button>
    <button *ngFor="let c of categories" class="logo-cat-btn"
      [class.active]="selectedCategory===c.id"
      (click)="selectedCategory=c.id; onCategoryChange()">
      {{ c.name }}
    </button>
  </div>

  <!-- Search -->
  <div class="adm-toolbar" style="margin-bottom:24px">
    <div class="adm-search">
      <i class="bi bi-search adm-search-icon"></i>
      <input type="text" placeholder="Search logos..." [(ngModel)]="searchTerm">
    </div>
  </div>

  <!-- Logos grid -->
  <div class="logo-grid">
    <div class="logo-card" *ngFor="let logo of filteredLogos" (click)="openLogo(logo)">
      <div class="logo-img-box">
        <img [src]="logo.imageUrl" class="logo-img" [alt]="logo.name"
             onerror="this.src='https://via.placeholder.com/120?text=Logo'">
      </div>
      <div class="logo-info">
        <span class="logo-name">{{ logo.name }}</span>
        <span class="logo-dim">{{ logo.widthPx }} × {{ logo.heightPx }} px</span>
      </div>
    </div>

    <div class="logo-empty" *ngIf="!filteredLogos?.length">
      <i class="bi bi-image-fill"></i>
      <p>No logos found</p>
    </div>
  </div>

</div>

<!-- Overlay -->
<div class="adm-overlay" *ngIf="selectedLogo" (click)="selectedLogo=null"></div>

<!-- Logo detail drawer -->
<div class="adm-drawer" [class.open]="!!selectedLogo">
  <div class="adm-drawer-head">
    <h5 class="adm-drawer-title">Logo Details</h5>
    <button class="adm-drawer-close" (click)="selectedLogo=null">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <div class="adm-drawer-body" *ngIf="selectedLogo">

    <div class="logo-preview-box">
      <img [src]="selectedLogo.imageUrl" class="logo-preview-img"
           onerror="this.src='https://via.placeholder.com/200?text=Logo'">
    </div>

    <div style="display:flex;flex-direction:column;gap:16px;margin-top:24px">

      <!-- Name -->
      <div class="adm-form-group">
        <label>Name</label>
        <input class="adm-field" [(ngModel)]="selectedLogo.name" placeholder="Logo name">
      </div>

      <!-- Category (NEW) -->
      <div class="adm-form-group">
        <label>Category</label>
        <select class="adm-field" [(ngModel)]="selectedLogo.categoryId">
          <option *ngFor="let c of categories" [value]="c.id">
            {{ c.name }}
          </option>
        </select>
      </div>

      <!-- Width / Height -->
      <div class="adm-form-grid">
        <div class="adm-form-group">
          <label>Width (px)</label>
          <input type="number" class="adm-field" [(ngModel)]="selectedLogo.widthPx">
        </div>
        <div class="adm-form-group">
          <label>Height (px)</label>
          <input type="number" class="adm-field" [(ngModel)]="selectedLogo.heightPx">
        </div>
      </div>

      <!-- Replace Image -->
      <div class="adm-form-group">
        <label>Replace Image</label>
        <input type="file" class="adm-field" (change)="onLogoFileChange($event)">
      </div>

    </div>
  </div>

  <div class="adm-drawer-footer" *ngIf="selectedLogo">
    <button class="adm-btn-danger" (click)="deleteLogo(selectedLogo.id)">
      <i class="bi bi-trash"></i> Delete
    </button>

    <button class="adm-btn-primary" style="flex:2;justify-content:center"
            (click)="updateLogo()">
      <i class="bi bi-check2"></i> Update Logo
    </button>
  </div>
</div>
