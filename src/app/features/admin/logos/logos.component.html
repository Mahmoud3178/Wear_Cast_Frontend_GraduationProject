<div class="container-fluid p-4">

  <!-- 🔝 Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">

    <div>
      <h3 class="fw-bold">Logos Management</h3>
      <p class="text-muted mb-0">
        Organize brand assets, partner logos, and website icons.
      </p>
    </div>

    <div class="d-flex gap-2">

      <input type="text"
             class="form-control"
             placeholder="Search logos..."
             style="width: 250px;"
             [(ngModel)]="searchTerm">

      <a routerLink="/admin/add-logos" class="btn btn-primary">
        + Add New Logo
      </a>

    </div>
  </div>

<!-- 🔹 Filters -->
<div class="card p-3 mb-4 shadow-sm d-flex flex-row justify-content-between">

  <div>
    <label class="me-2 fw-bold">Category:</label>

<select class="form-select d-inline w-auto"
        [(ngModel)]="selectedCategory"
        (change)="onCategoryChange()">

  <option [ngValue]="null">🌐 All</option>

  <option *ngFor="let c of categories" [ngValue]="c.id">
    {{c.name}}
  </option>

</select>
  </div>

</div>

  <!-- 🔹 Grid -->
  <div class="row g-4">

    <div class="col-md-3" *ngFor="let logo of filteredLogos">

      <div class="card shadow-sm border-0 p-3 h-100 logo-card"
           style="cursor:pointer"
           (click)="openLogo(logo)"
           data-bs-toggle="offcanvas"
           data-bs-target="#logoPanel">

        <!-- Preview -->
        <div class="text-center my-3">
          <img [src]="logo.imageUrl"
               class="img-fluid"
               style="height:100px;object-fit:contain;">
        </div>

        <!-- Info -->
        <h6 class="fw-bold">{{logo.name}}</h6>
        <small class="text-muted">ID: {{logo.id}}</small>

      </div>

    </div>

  </div>
</div>

<!-- 🔥 OFFCANVAS -->
<div class="offcanvas offcanvas-end"
     tabindex="-1"
     id="logoPanel">

  <div class="offcanvas-header">
    <h5 class="fw-bold">Logo Details</h5>
    <button class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>

  <div class="offcanvas-body" *ngIf="selectedLogo">

    <!-- Image -->
    <div class="text-center mb-3">
      <img [src]="selectedLogo.imageUrl"
           class="img-fluid"
           style="max-height:150px;">
    </div>

    <!-- Name -->
    <label class="form-label">Name</label>
    <input class="form-control mb-3"
           [(ngModel)]="selectedLogo.name">

    <!-- Width -->
    <label class="form-label">Width</label>
    <input class="form-control mb-3"
           type="number"
           [(ngModel)]="selectedLogo.widthPx">

    <!-- Height -->
    <label class="form-label">Height</label>
    <input class="form-control mb-3"
           type="number"
           [(ngModel)]="selectedLogo.heightPx">

    <!-- Buttons -->
    <div class="d-flex gap-2">

      <button class="btn btn-danger w-50"
              (click)="deleteLogo(selectedLogo.id)">
        Delete
      </button>

      <button class="btn btn-primary w-50"
              (click)="updateLogo()">
        Update
      </button>

    </div>

  </div>
</div>
