<div class="container-fluid p-4">

  <!-- HEADER -->
<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">

  <div>
    <h3 class="fw-bold mb-1">Logos Management</h3>
    <small class="text-muted">Manage and organize your assets</small>
  </div>

  <div class="d-flex flex-wrap gap-2">

    <input type="text"
           class="form-control"
           placeholder="Search..."
           style="min-width:200px"
           [(ngModel)]="searchTerm">

    <a routerLink="/admin/add-logos" class="btn btn-primary">
      + Add Logo
    </a>

    <button class="btn btn-outline-dark"
            data-bs-toggle="modal"
            data-bs-target="#addCategoryModal">
      + Category
    </button>

  </div>

</div>

  <!-- 🔥 CATEGORY CHIPS -->
  <div class="d-flex flex-wrap gap-2 mb-3">

    <button class="btn btn-sm rounded-pill"
            [ngClass]="selectedCategory === null ? 'btn-dark' : 'btn-outline-dark'"
            (click)="selectedCategory = null; onCategoryChange()">
      All
    </button>

    <button *ngFor="let c of categories"
            class="btn btn-sm rounded-pill"
            [ngClass]="selectedCategory === c.id ? 'btn-primary' : 'btn-outline-secondary'"
            (click)="selectedCategory = c.id; onCategoryChange()">
      {{c.name}}
    </button>

  </div>

  <!-- LOGOS GRID -->
  <div class="row g-4">

  <div class="col-lg-3 col-md-4 col-sm-6" *ngFor="let logo of filteredLogos">

  <div class="card logo-card shadow-sm border-0 h-100"
       (click)="openLogo(logo)"
       data-bs-toggle="offcanvas"
       data-bs-target="#logoPanel">

    <div class="logo-img-wrapper">
      <img [src]="logo.imageUrl">
    </div>

    <div class="card-body text-center">
      <h6 class="fw-semibold mb-0">{{logo.name}}</h6>
    </div>

  </div>

</div>

  </div>
</div>

<!-- 🔥 ADD CATEGORY MODAL -->
<div class="modal fade" id="addCategoryModal">

  <div class="modal-dialog">

    <div class="modal-content">

      <div class="modal-header">
        <h5 class="fw-bold">Add Category</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <input type="text"
               class="form-control"
               placeholder="Category name"
               [(ngModel)]="newCategoryName">

      </div>

      <div class="modal-footer">

        <button class="btn btn-light" data-bs-dismiss="modal">
          Cancel
        </button>

        <button class="btn btn-primary" (click)="addCategory()">
          Save
        </button>

      </div>

    </div>

  </div>

</div>

<!-- OFFCANVAS -->
<div class="offcanvas offcanvas-end" id="logoPanel">

  <div class="offcanvas-header">
    <h5>Logo Details</h5>
    <button class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>

  <div class="offcanvas-body" *ngIf="selectedLogo">

    <img [src]="selectedLogo.imageUrl"
         class="img-fluid mb-3">

    <input class="form-control mb-2"
           [(ngModel)]="selectedLogo.name">

    <button class="btn btn-primary w-100 mb-2"
            (click)="updateLogo()">
      Update
    </button>

    <button class="btn btn-danger w-100"
            (click)="deleteLogo(selectedLogo.id)">
      Delete
    </button>

  </div>

</div>
