<div class="container-fluid p-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold">Customer Details</h4>

    <div>
      <button class="btn btn-outline-primary btn-sm">Edit Profile</button>
      <button class="btn btn-danger btn-sm">Block Account</button>
    </div>
  </div>

  <div class="row">

    <!-- Left Card -->
    <div class="col-md-4">
      <div class="card p-3 text-center shadow-sm">

        <!-- Image -->
        <img [src]="customer?.image"
             class="rounded-circle mx-auto mb-2"
             width="100"
             height="100">

        <!-- Name -->
        <h5>{{customer?.name}}</h5>

        <!-- Phone -->
        <p class="text-muted">{{customer?.phoneNumber}}</p>

        <hr>

        <!-- Address -->
        <p><strong>City:</strong> {{customer?.city}}</p>
        <p><strong>State:</strong> {{customer?.state}}</p>
        <p><strong>Street:</strong> {{customer?.street}}</p>
        <p><strong>Building:</strong> {{customer?.buildingNumber}}</p>

      </div>
    </div>

    <!-- Right -->
    <div class="col-md-8">
      <div class="card shadow-sm">

        <div class="card-body">
          <h6 class="fw-bold mb-3">Order History</h6>

          <div class="text-center text-muted py-4">
            No orders available
          </div>

        </div>
      </div>
    </div>

  </div>

</div>
