<div class="container-fluid p-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold">Customer Details</h4>

    <div>
      <button class="btn btn-outline-primary btn-sm">Edit Profile</button>
      <button class="btn btn-danger btn-sm">Block Account</button>
    </div>
  </div>

  <div class="row">

    <!-- Left Card -->
    <div class="col-md-4">
      <div class="card p-3 text-center shadow-sm">

        <img src="https://i.pravatar.cc/100" class="rounded-circle mx-auto mb-2">

        <h5>Customer #{{customerId}}</h5>
        <p class="text-muted">email&#64;example.com</p>

        <hr>

        <div class="d-flex justify-content-between">
          <div>
            <small>Total Orders</small>
            <h6>24</h6>
          </div>

          <div>
            <small>Total Spent</small>
            <h6>$3,450</h6>
          </div>
        </div>

      </div>
    </div>

    <!-- Orders -->
    <div class="col-md-8">
      <div class="card shadow-sm">

        <div class="card-body">
          <h6 class="fw-bold mb-3">Order History</h6>

          <table class="table">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Date</th>
                <th>Total</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td>#ORD-001</td>
                <td>2024-01-01</td>
                <td>$120</td>
              </tr>

              <tr>
                <td>#ORD-002</td>
                <td>2024-02-01</td>
                <td>$250</td>
              </tr>
            </tbody>

          </table>

        </div>
      </div>
    </div>

  </div>

</div>
