<div class="container-fluid">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4 pt-4">
    <div>
      <h2 class="fw-bold">Designed Products 🎨</h2>
      <p class="text-muted">Manage all designed products</p>
    </div>
  </div>

  <!-- Search -->
  <div class="card border-0 shadow-sm mb-3">
    <div class="card-body">
      <input
        type="text"
        class="form-control"
        placeholder="Search designed products..."
        [(ngModel)]="searchTerm"
        (input)="applyFilter()"
      />
    </div>
  </div>

  <!-- Table -->
  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table align-middle mb-0">

        <thead class="table-light">
          <tr>
<th>Product</th>
<th>Audience</th>
<th>Price</th>
<th>Id</th>
          </tr>
        </thead>

        <tbody>
<tr *ngFor="let product of products"
    [routerLink]="['/admin/design-products', product.id]"
    style="cursor:pointer">

  <!-- Product -->
  <td class="d-flex align-items-center gap-2">
    <img
      [src]="product.mainImageUrl || 'https://via.placeholder.com/300'"
      class="rounded"
      width="40"
      height="40">

    <span class="fw-semibold">
      {{ product.name }}
    </span>
  </td>

  <!-- 🎯 Audience -->
  <td>
    <span class="badge bg-secondary me-1"
          *ngFor="let t of product.targetAudiences">
      {{ t }}
    </span>
  </td>

  <!-- 💰 Price -->
  <td class="fw-semibold text-success">
    ${{ product.price }}
  </td>

  <!-- 🆔 ID -->
  <td class="fw-semibold">
    {{ product.id }}
  </td>

</tr>
        </tbody>

      </table>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-between align-items-center p-3 border-top">

      <small class="text-muted">
        Page {{ currentPage }}
      </small>

      <nav>
        <ul class="pagination mb-0">

          <li class="page-item" [class.disabled]="currentPage === 1">
            <button class="page-link" (click)="prevPage()">Prev</button>
          </li>

          <li class="page-item"
              *ngFor="let page of totalPages"
              [class.active]="page === currentPage">

            <button class="page-link" (click)="goToPage(page)">
              {{ page }}
            </button>

          </li>

          <li class="page-item"
              [class.disabled]="currentPage === totalPages.length">
            <button class="page-link" (click)="nextPage()">Next</button>
          </li>

        </ul>
      </nav>

    </div>
  </div>

</div>
