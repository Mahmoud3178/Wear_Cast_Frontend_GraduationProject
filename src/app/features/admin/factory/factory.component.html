<div class="page-wrap">

  <div class="adm-header">
    <div>
      <h1 class="adm-title">Factory</h1>
      <p class="adm-subtitle">Manage the platform factory profile</p>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="adm-btn-primary" (click)="openFactoryModal()" [disabled]="factory">
        <i class="bi bi-plus-lg"></i> Add Factory
      </button>
      <button class="adm-btn-secondary" (click)="toggleEdit()">
        <i class="bi" [class.bi-pencil]="!editMode" [class.bi-x-lg]="editMode"></i>
        {{ editMode ? 'Cancel' : 'Edit' }}
      </button>
      <button class="adm-btn-primary" *ngIf="editMode" (click)="save()" style="background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 2px 8px rgba(16,185,129,0.3)">
        <i class="bi bi-check2"></i> Save Changes
      </button>
      <button class="adm-btn-danger" (click)="deleteFactory()">
        <i class="bi bi-trash"></i> Delete
      </button>
    </div>
  </div>

  <!-- Loading -->
  <div class="adm-loading" *ngIf="loading">
    <div class="adm-spinner"></div>
  </div>

  <!-- Factory view -->
  <div *ngIf="!loading && factory">
    <div class="profile-layout">

      <!-- Profile card -->
      <div class="adm-profile-card">
        <img [src]="factory.logoUrl" class="adm-profile-img" onerror="this.src='https://ui-avatars.com/api/?name=F&background=6366f1&color=fff&size=96'">
        <h2 class="adm-profile-name">{{ factory.name }}</h2>
        <p class="adm-profile-sub">{{ factory.email }}</p>
        <p class="adm-profile-sub" style="margin-top:-10px">{{ factory.phoneNumber }}</p>
        <div *ngIf="editMode" style="margin-top:14px;display:flex;flex-direction:column;gap:8px">
          <input type="file" class="adm-field" (change)="onFileChange($event)">
          <button class="adm-btn-secondary" style="justify-content:center" (click)="uploadLogo()">
            <i class="bi bi-cloud-upload"></i> Upload Logo
          </button>
        </div>
      </div>

      <!-- Info card -->
      <div>
        <div class="adm-card">
          <div class="adm-card-head">
            <h3 class="adm-card-title"><i class="bi bi-building"></i> Factory Info</h3>
          </div>
          <div class="adm-card-body">
            <div class="adm-form-grid">
              <div class="adm-form-group">
                <label>Factory Name</label>
                <input class="adm-field" [(ngModel)]="form.name" [disabled]="!editMode">
              </div>
              <div class="adm-form-group">
                <label>Email</label>
                <input class="adm-field" [(ngModel)]="form.email" [disabled]="!editMode">
              </div>
              <div class="adm-form-group">
                <label>Phone</label>
                <input class="adm-field" [(ngModel)]="form.phoneNumber" [disabled]="!editMode">
              </div>
              <div class="adm-form-group">
                <label>Commercial Reg</label>
                <input class="adm-field" [(ngModel)]="form.commercialRegisterNumber" [disabled]="!editMode">
              </div>
              <div class="adm-form-group">
                <label>Tax ID</label>
                <input class="adm-field" [(ngModel)]="form.taxIdNumber" [disabled]="!editMode">
              </div>
              <div class="adm-form-group full">
                <label>Description</label>
                <textarea class="adm-field" rows="3" [(ngModel)]="form.description" [disabled]="!editMode"></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Empty state -->
  <div class="adm-card" *ngIf="!loading && !factory">
    <div class="adm-card-body">
      <div class="adm-empty">
        <i class="bi bi-building-x"></i>
        <p>No factory registered yet. Click "Add Factory" to get started.</p>
      </div>
    </div>
  </div>

</div>

<!-- Add Factory Modal -->
<div class="adm-modal-overlay" *ngIf="showFactoryModal" (click)="closeAddModal()">
  <div class="adm-modal adm-modal-xl" (click)="$event.stopPropagation()">
    <div class="adm-modal-head">
      <h3 class="adm-modal-title"><i class="bi bi-building-add"></i> Add New Factory</h3>
      <button class="adm-modal-close" (click)="closeAddModal()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="adm-modal-body">

      <div class="adm-section-label"><i class="bi bi-building"></i> Factory Info</div>
      <div class="adm-form-grid" style="margin-bottom:20px">
        <div class="adm-form-group"><label>Factory Name <span class="adm-req">*</span></label><input class="adm-field" placeholder="Factory name" [(ngModel)]="form.name"></div>
        <div class="adm-form-group"><label>Email <span class="adm-req">*</span></label><input class="adm-field" placeholder="Email" [(ngModel)]="form.email"></div>
        <div class="adm-form-group"><label>Phone</label><input class="adm-field" placeholder="Phone" [(ngModel)]="form.phoneNumber"></div>
        <div class="adm-form-group"><label>City</label><input class="adm-field" placeholder="City" [(ngModel)]="form.city"></div>
        <div class="adm-form-group"><label>State</label><input class="adm-field" placeholder="State" [(ngModel)]="form.state"></div>
        <div class="adm-form-group"><label>Street</label><input class="adm-field" placeholder="Street" [(ngModel)]="form.street"></div>
        <div class="adm-form-group"><label>Building</label><input class="adm-field" placeholder="Building No." [(ngModel)]="form.buildingNumber"></div>
        <div class="adm-form-group"><label>Commercial Reg <span class="adm-req">*</span></label><input class="adm-field" [(ngModel)]="form.commercialRegisterNumber"></div>
        <div class="adm-form-group"><label>Tax ID <span class="adm-req">*</span></label><input class="adm-field" [(ngModel)]="form.taxIdNumber"></div>
        <div class="adm-form-group full"><label>Description</label><textarea class="adm-field" rows="3" [(ngModel)]="form.description"></textarea></div>
      </div>

      <div class="adm-section-label"><i class="bi bi-person-badge"></i> Manager Info</div>
      <div class="adm-form-grid">
        <div class="adm-form-group"><label>First Name <span class="adm-req">*</span></label><input class="adm-field" placeholder="First name" [(ngModel)]="form.managerFirstName"></div>
        <div class="adm-form-group"><label>Last Name</label><input class="adm-field" placeholder="Last name" [(ngModel)]="form.managerLastName"></div>
        <div class="adm-form-group"><label>Email <span class="adm-req">*</span></label><input class="adm-field" placeholder="Manager email" [(ngModel)]="form.managerEmail"></div>
        <div class="adm-form-group"><label>Phone</label><input class="adm-field" placeholder="Manager phone" [(ngModel)]="form.managerPhone"></div>
        <div class="adm-form-group"><label>Password <span class="adm-req">*</span></label><input type="password" class="adm-field" placeholder="Password" [(ngModel)]="form.password"></div>
        <div class="adm-form-group"><label>Confirm Password <span class="adm-req">*</span></label><input type="password" class="adm-field" placeholder="Confirm" [(ngModel)]="form.confirmPassword"></div>
        <div class="adm-form-group full"><label>Logo</label><input type="file" class="adm-field" (change)="onFileChange($event)"></div>
      </div>

    </div>
    <div class="adm-modal-footer">
      <button class="adm-btn-secondary" (click)="closeAddModal()">Cancel</button>
      <button class="adm-btn-primary" (click)="addFactory()"><i class="bi bi-plus-lg"></i> Create Factory</button>
    </div>
  </div>
</div>
