<div class="container-fluid p-4">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold">Factory 🏭</h3>
      <p class="text-muted">Manage factory profile</p>
    </div>

    <div class="d-flex gap-2">
            <button class="btn btn-primary" (click)="openFactoryModal()"  [disabled]="factory">
        + Add Factory
      </button>
      <button class="btn btn-outline-primary" (click)="toggleEdit()">
        {{ editMode ? 'Cancel' : 'Edit' }}
      </button>

      <button class="btn btn-success" *ngIf="editMode" (click)="save()">
        Save
      </button>

      <button class="btn btn-danger" (click)="deleteFactory()">
        Delete
      </button>
    </div>
  </div>
<div class="modal fade show d-block" *ngIf="showFactoryModal">
  <div class="modal-dialog modal-xl">
    <div class="modal-content shadow-lg rounded-4">

      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">🏭 Add Factory</h5>
        <button class="btn-close btn-close-white" (click)="closeAddModal()"></button>
      </div>

      <div class="modal-body">

        <div class="row g-3">

          <!-- Factory -->
          <div class="col-12">
            <h6 class="text-primary">Factory Info</h6>
          </div>

          <div class="col-md-4">
            <input class="form-control" placeholder="Factory Name" [(ngModel)]="form.name">
          </div>

          <div class="col-md-4">
            <input class="form-control" placeholder="Email" [(ngModel)]="form.email">
          </div>

          <div class="col-md-4">
            <input class="form-control" placeholder="Phone" [(ngModel)]="form.phoneNumber">
          </div>

          <div class="col-md-4">
            <input class="form-control" placeholder="City" [(ngModel)]="form.city">
          </div>

          <div class="col-md-4">
            <input class="form-control" placeholder="Street" [(ngModel)]="form.street">
          </div>

          <div class="col-md-4">
            <input class="form-control" placeholder="Building" [(ngModel)]="form.buildingNumber">
          </div>
          <!-- REQUIRED BACKEND FIELDS -->
<div class="col-md-4">
  <input class="form-control"
         placeholder="Commercial Register Number"
         [(ngModel)]="form.commercialRegisterNumber">
</div>

<div class="col-md-4">
  <input class="form-control"
         placeholder="Tax ID Number"
         [(ngModel)]="form.taxIdNumber">
</div>
<div class="col-md-4">
  <input class="form-control" placeholder="State" [(ngModel)]="form.state">
</div>

<div class="col-md-12">
  <textarea class="form-control"
            rows="3"
            placeholder="Factory Description"
            [(ngModel)]="form.description"></textarea>
</div>
          <hr class="my-3">

          <!-- Manager -->
          <div class="col-12">
            <h6 class="text-success">Manager Info</h6>
          </div>

          <div class="col-md-4">
            <input class="form-control" placeholder="First Name" [(ngModel)]="form.managerFirstName">
          </div>

          <div class="col-md-4">
            <input class="form-control" placeholder="Last Name" [(ngModel)]="form.managerLastName">
          </div>

          <div class="col-md-4">
            <input class="form-control" placeholder="Email" [(ngModel)]="form.managerEmail">
          </div>

          <div class="col-md-4">
            <input class="form-control" placeholder="Phone" [(ngModel)]="form.managerPhone">
          </div>

          <div class="col-md-4">
            <input type="password" class="form-control" placeholder="Password" [(ngModel)]="form.password">
          </div>

          <div class="col-md-4">
            <input type="password" class="form-control" placeholder="Confirm Password" [(ngModel)]="form.confirmPassword">
          </div>

          <div class="col-md-6">
            <input type="file" class="form-control" (change)="onFileChange($event)">
          </div>

        </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="closeAddModal()">Close</button>
        <button class="btn btn-success px-4" (click)="addFactory()">➕ Create</button>
      </div>

    </div>
  </div>
</div>
  <!-- LOADING -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
  </div>

  <div *ngIf="!loading && factory">

    <div class="row g-4">

      <!-- LEFT -->
      <div class="col-md-4">

        <div class="card border-0 shadow-sm text-center p-3">

          <img [src]="factory.logoUrl" class="company-logo mb-3">

          <h5 class="fw-bold">{{ factory.name }}</h5>

          <p class="text-muted">{{ factory.email }}</p>
          <p class="text-muted">{{ factory.phoneNumber }}</p>

          <div *ngIf="editMode">
            <input type="file" class="form-control mb-2" (change)="onFileChange($event)">
            <button class="btn btn-sm btn-dark w-100" (click)="uploadLogo()">
              Upload Logo
            </button>
          </div>

        </div>

      </div>

      <!-- RIGHT -->
      <div class="col-md-8">

        <div class="card border-0 shadow-sm p-3">

          <h5 class="fw-bold mb-3">Factory Info</h5>

          <div class="row g-3">

            <div class="col-md-6">
              <label>Name</label>
              <input class="form-control" [(ngModel)]="form.name" [disabled]="!editMode">
            </div>

            <div class="col-md-6">
              <label>Email</label>
              <input class="form-control" [(ngModel)]="form.email" [disabled]="!editMode">
            </div>

            <div class="col-md-6">
              <label>Phone</label>
              <input class="form-control" [(ngModel)]="form.phoneNumber" [disabled]="!editMode">
            </div>

            <div class="col-md-6">
              <label>Commercial Reg</label>
              <input class="form-control" [(ngModel)]="form.commercialRegisterNumber" [disabled]="!editMode">
            </div>

            <div class="col-md-6">
              <label>Tax ID</label>
              <input class="form-control" [(ngModel)]="form.taxIdNumber" [disabled]="!editMode">
            </div>

            <div class="col-md-12">
              <label>Description</label>
              <textarea class="form-control" rows="3"
                        [(ngModel)]="form.description"
                        [disabled]="!editMode"></textarea>
            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
