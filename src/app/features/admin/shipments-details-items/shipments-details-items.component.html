<div class="page-wrap">

  <div class="adm-header">
    <div>
      <h1 class="adm-title">Shipment Items</h1>
      <p class="adm-subtitle">All items in this shipment</p>
    </div>
    <span class="adm-badge badge-dark" style="font-size:13px;padding:6px 14px">{{ allItems.length }} Items</span>
  </div>

  <div class="items-grid">
    <div class="ship-item-card" *ngFor="let item of allItems">
      <div class="ship-item-head">
        <div>
          <div class="ship-item-name">{{ item.productName }}</div>
          <span class="adm-badge" [class.badge-info]="item.type==='fixed'" [class.badge-purple]="item.type==='designed'" style="margin-top:4px">
            {{ item.type }}
          </span>
        </div>
        <div class="ship-item-price">{{ item.totalPrice }} EGP</div>
      </div>

      <div class="ship-item-info">
        <div class="adm-info-item"><span class="adm-info-label">Color</span><span class="adm-info-value">{{ item.colorName }}</span></div>
        <div class="adm-info-item"><span class="adm-info-label">Unit Price</span><span class="adm-info-value">{{ item.unitPrice }} EGP</span></div>
        <div class="adm-info-item"><span class="adm-info-label">Quantity</span><span class="adm-info-value">{{ item.totalQuantity }}</span></div>
      </div>

      <!-- Design images -->
      <div *ngIf="item.type==='designed'" class="ship-item-images">
        <img *ngIf="item.frontImageUrl" [src]="item.frontImageUrl" title="Front">
        <img *ngIf="item.backImageUrl"  [src]="item.backImageUrl"  title="Back">
        <img *ngIf="item.rightImageUrl" [src]="item.rightImageUrl" title="Right">
        <img *ngIf="item.leftImageUrl"  [src]="item.leftImageUrl"  title="Left">
      </div>

      <!-- Sizes -->
      <div *ngIf="item.sizes?.length" class="ship-item-sizes">
        <span class="adm-info-label">Sizes</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
          <span class="adm-badge badge-dark" *ngFor="let s of item.sizes">{{ s.sizeName }} ({{ s.quantity }})</span>
        </div>
      </div>
    </div>
  </div>

</div>
