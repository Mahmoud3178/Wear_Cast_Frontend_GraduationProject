<div class="container py-4">

  <h3 class="fw-bold mb-4">Shipment Items</h3>

  <div class="row g-4">

    <div class="col-lg-6" *ngFor="let item of allItems">

      <div class="card shadow-sm border-0 h-100">

        <div class="card-body">

          <!-- HEADER -->
          <div class="d-flex justify-content-between align-items-start mb-3">

            <div>
              <h5 class="fw-bold mb-1">{{ item.productName }}</h5>
              <span class="badge bg-primary">
                {{ item.type }}
              </span>
            </div>

            <div class="text-end">
              <div class="fw-bold text-success">
                {{ item.totalPrice }} EGP
              </div>
            </div>

          </div>

          <!-- INFO -->
          <div class="row">

            <div class="col-6 mb-2">
              <small class="text-muted">Color</small>
              <div class="fw-semibold">{{ item.colorName }}</div>
            </div>

            <div class="col-6 mb-2">
              <small class="text-muted">Unit Price</small>
              <div class="fw-semibold">{{ item.unitPrice }}</div>
            </div>

            <div class="col-6 mb-2">
              <small class="text-muted">Quantity</small>
              <div class="fw-semibold">{{ item.totalQuantity }}</div>
            </div>

          </div>

          <!-- IMAGES (for designed only) -->
          <div *ngIf="item.type === 'designed'" class="mt-3">

            <div class="d-flex gap-2 flex-wrap">

              <img [src]="item.frontImageUrl" class="img-thumbnail" width="70">
              <img [src]="item.backImageUrl" class="img-thumbnail" width="70">
              <img [src]="item.rightImageUrl" class="img-thumbnail" width="70">
              <img [src]="item.leftImageUrl" class="img-thumbnail" width="70">

            </div>

          </div>

          <!-- SIZES -->
          <div class="mt-3" *ngIf="item.sizes?.length">

            <small class="text-muted">Sizes</small>

            <div class="d-flex gap-2 flex-wrap mt-1">

              <span *ngFor="let s of item.sizes"
                    class="badge bg-dark">
                {{ s.sizeName }} ({{ s.quantity }})
              </span>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
