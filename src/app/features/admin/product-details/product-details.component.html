<div class="container-fluid p-4" *ngIf="!loading && product">

  <h3 class="fw-bold mb-4">{{ product.name }}</h3>

  <div class="row">

    <!-- Image -->
    <div class="col-md-4">
      <div class="card p-3 shadow-sm">
     <img [src]="product.category?.imageUrl || 'https://via.placeholder.com/300'">

      </div>
    </div>

    <!-- Details -->
    <div class="col-md-8">

      <div class="card p-3 shadow-sm mb-3">
        <h6 class="fw-bold">Description</h6>
        <p class="text-muted">{{ product.description }}</p>
      </div>

      <div class="row">

        <div class="col-md-4">
          <div class="card p-3 text-center shadow-sm">
            <small>Price</small>
            <h5>${{ product.price }}</h5>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card p-3 text-center shadow-sm">
            <small>Stock</small>
            <h5>{{ product.stock }}</h5>
          </div>
        </div>

      </div>

    </div>

  </div>

</div>

<div *ngIf="loading" class="text-center p-5">
  <div class="spinner-border"></div>
</div>
