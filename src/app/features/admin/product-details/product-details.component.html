<div class="container-fluid p-4">

  <!-- Loading -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
  </div>

  <div *ngIf="!loading && product">

    <div class="row">

      <!-- ================= IMAGES ================= -->
      <div class="col-md-6">

        <!-- MAIN IMAGE -->
        <div class="position-relative">

          <img class="img-fluid rounded shadow-sm"
               [src]="getImage(currentImage)"
               style="height:400px;object-fit:cover;width:100%">

          <!-- PREV -->
          <button class="nav-btn left" (click)="prevImage()">‹</button>

          <!-- NEXT -->
          <button class="nav-btn right" (click)="nextImage()">›</button>

        </div>

        <!-- THUMBNAILS -->
        <div class="d-flex gap-2 mt-3 flex-wrap">

          <!-- main -->
          <img
            [src]="getImage(selectedColor?.imageUrl)"
            (click)="setImageByIndex(0)"
            [class.active-thumb]="currentIndex === 0"
            class="thumb-img">

          <!-- gallery -->
          <img
            *ngFor="let img of selectedColor?.images; let i = index"
            [src]="getImage(img.imageUrl)"
            (click)="setImageByIndex(i + 1)"
            [class.active-thumb]="currentIndex === i + 1"
            class="thumb-img">

        </div>

      </div>

      <!-- ================= INFO ================= -->
      <div class="col-md-6">

        <h2 class="fw-bold">{{ product.name }}</h2>

        <p class="text-muted">
          {{ product.description }}
        </p>

        <div class="mb-2">
          <strong>Category:</strong>
          {{ product.category?.name }}
        </div>

        <div class="mb-2 text-muted">
          Seller ID: {{ product.sellerId }}
        </div>

        <h4 class="text-success">
          ${{ product.price }}
        </h4>

        <div class="mt-2">
          <span class="badge bg-info text-dark">
            {{ product.targetAudience }}
          </span>
        </div>

        <hr>

        <!-- COLORS -->
        <div>
          <h6>Colors</h6>

          <div class="d-flex gap-2">

            <div *ngFor="let c of product.colors"
                 (click)="changeColor(c)"
                 style="cursor:pointer">

              <div [style.background]="c.colorCode"
                   class="color-circle">
              </div>

            </div>

          </div>
        </div>

        <!-- SIZES -->
        <div class="mt-3">
          <h6>Available Sizes</h6>

          <div class="d-flex flex-wrap gap-2">

            <span
              *ngFor="let s of selectedColor?.availableSizes"
              class="badge"
              [class.bg-success]="s.quantity > 0"
              [class.bg-danger]="s.quantity === 0">

              {{ s.size }} ({{ s.quantity }})

            </span>

          </div>
        </div>

        <hr>

        <!-- SIZE DETAILS -->
        <div class="mt-3">
          <h6>Size Details</h6>

          <table class="table table-sm table-bordered w-auto">
            <thead>
              <tr>
                <th>Size</th>
                <th>A</th>
                <th>B</th>
                <th>C</th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let s of product.sizeDetails">
                <td>{{ s.size }}</td>
                <td>{{ s.a }}</td>
                <td>{{ s.b }}</td>
                <td>{{ s.c }}</td>
              </tr>
            </tbody>
          </table>

        </div>

      </div>

    </div>

  </div>

</div>
