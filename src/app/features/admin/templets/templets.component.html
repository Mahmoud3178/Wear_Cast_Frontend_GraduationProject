<div class="container-fluid p-4">

  <!-- 🔝 Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-1">Template Management</h3>
      <p class="text-muted mb-0">
        Manage and review clothing store templates submitted by vendors.
      </p>
    </div>

    <button class="btn btn-primary px-4 shadow-sm">
      + Create New Template
    </button>
  </div>

  <!-- 🔍 Filters -->
  <div class="card shadow-sm border-0 mb-3">
    <div class="card-body">

      <div class="d-flex justify-content-between align-items-center">

        <!-- Search -->
        <div class="input-group w-50">
          <span class="input-group-text bg-light border-0">
            <i class="bi bi-search"></i>
          </span>
          <input type="text"
                 class="form-control bg-light border-0"
                 placeholder="Search by template name or ID...">
        </div>

        <!-- Right Filters -->
        <div class="d-flex gap-2">
          <button class="btn btn-light border">
            Date Added: Newest
          </button>

          <button class="btn btn-light border">
            More Filters
          </button>
        </div>

      </div>

    </div>
  </div>

  <!-- 📋 Table -->
  <div class="card shadow-sm border-0">
    <div class="card-body p-0">

      <table class="table align-middle mb-0">

        <thead class="table-light">
          <tr>
            <th>Preview</th>
            <th>Template Name</th>
            <th>Description</th>
            <th>Submitted</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let t of templates">

            <!-- Image -->
            <td>
              <img [src]="t.img"
                   class="rounded"
                   width="50" height="50">
            </td>

            <!-- Name -->
            <td>
              <div class="fw-semibold">{{t.name}}</div>
              <small class="text-muted">ID: {{t.id}}</small>
            </td>

            <!-- Desc -->
            <td class="text-muted">
              {{t.desc}}
            </td>

            <!-- Date -->
            <td>{{t.date}}</td>

            <!-- Actions -->
            <td class="text-end">

              <button class="btn btn-sm btn-light border me-2">
                <i class="bi bi-eye"></i> View Details
              </button>

              <button class="btn btn-sm btn-light border text-danger">
                <i class="bi bi-trash"></i> Delete
              </button>

            </td>

          </tr>

        </tbody>

      </table>

      <!-- Pagination -->
      <div class="d-flex justify-content-between align-items-center p-3">

        <small class="text-muted">
          Showing 1 to 5 of 42 results
        </small>

        <div>
          <button class="btn btn-sm btn-light border me-2">Previous</button>
          <button class="btn btn-sm btn-light border">Next</button>
        </div>

      </div>

    </div>
  </div>

</div>
