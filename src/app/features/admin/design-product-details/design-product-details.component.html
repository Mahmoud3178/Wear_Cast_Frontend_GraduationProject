<div class="container-fluid p-4">

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
  </div>

  <div *ngIf="!loading && product">

    <div class="row">

      <!-- IMAGE -->
      <div class="col-md-6">

        <img class="img-fluid rounded shadow-sm mb-3"
             [src]="getImage(selectedColor?.mainImageUrl)">

        <!-- COLOR IMAGES -->
        <div class="row g-2">

          <div class="col-6"
               *ngFor="let img of selectedColor?.images">

            <img class="img-fluid rounded border"
                 [src]="getImage(img.imageUrl)"
                 style="height:120px;object-fit:cover;">

            <small class="text-muted d-block text-center">
              {{ img.viewSide }}
            </small>

          </div>

        </div>

      </div>

      <!-- INFO -->
      <div class="col-md-6">

        <h2>{{ product.name }}</h2>

        <p class="text-muted">
          {{ product.description }}
        </p>

        <!-- PRICE -->
        <h4 class="text-success">
          ${{ product.price }}
        </h4>

        <!-- ⭐ RATING -->
        <div class="mt-2 d-flex align-items-center">

          <!-- Stars -->
          <div class="text-warning me-2">

            <!-- full stars -->
            <i class="bi bi-star-fill"
               *ngFor="let s of [].constructor(Math.floor(product.averageRating || 0))">
            </i>

            <!-- half star -->
            <i class="bi bi-star-half"
               *ngIf="(product.averageRating || 0) % 1 >= 0.5">
            </i>

            <!-- empty stars -->
            <i class="bi bi-star"
               *ngFor="let s of [].constructor(5 - Math.ceil(product.averageRating || 0))">
            </i>

          </div>

          <!-- numbers -->
          <small class="text-muted">
            {{ product.averageRating || 0 }}
            ({{ product.reviewCount || 0 }} reviews)
          </small>

        </div>

        <hr>

        <!-- COLORS -->
        <div>
          <h6>Colors</h6>

          <div class="d-flex gap-2">

            <div *ngFor="let c of product.colors"
                 (click)="changeColor(c)"
                 style="cursor:pointer">

              <div [style.background]="c.hexCode"
                   style="width:30px;height:30px;border-radius:50%;border:2px solid #ddd">
              </div>

            </div>

          </div>
        </div>

        <!-- TARGET AUDIENCE -->
        <div class="mt-3">
          <h6>Target Audience</h6>

          <span class="badge bg-secondary me-1"
                *ngFor="let t of product.targetAudiences">
            {{ t }}
          </span>

        </div>

      </div>

    </div>

  </div>

</div>
