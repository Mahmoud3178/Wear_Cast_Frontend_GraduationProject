<header class="driver-header d-flex align-items-center justify-content-between px-4 py-2 border-bottom shadow-sm sticky-top">
  <div class="d-flex align-items-center gap-3">
    <!-- Mobile Toggle -->
    <button class="btn btn-icon-premium d-lg-none" (click)="toggleSidebar.emit()" aria-label="Toggle Navigation">
      <i class="bi bi-list fs-4"></i>
    </button>
    
    <!-- Welcome Message (Desktop) -->
    <div class="d-none d-md-block">
      <h5 class="mb-0 fw-bold header-title">Driver Dashboard</h5>
      <p class="text-muted text-xs mb-0">Manage your deliveries and routes</p>
    </div>
  </div>
  
  <div class="d-flex align-items-center gap-2 gap-md-3">

    
    <!-- User Dropdown -->
    <div class="user-dropdown dropdown">
      <div class="user-trigger d-flex align-items-center gap-2 cursor-pointer p-1 rounded-pill hover-bg-premium transition-all dropdown-toggle" 
           data-bs-toggle="dropdown" aria-expanded="false">
        <div class="avatar-box shadow-sm border border-2 border-white">
          <div class="avatar-gradient d-flex align-items-center justify-content-center fw-bold text-white">
            {{ userName.charAt(0) || 'D' }}
          </div>
        </div>
        <div class="d-none d-md-block text-start pe-2">
          <p class="mb-0 fw-bold text-sm text-dark leading-tight">{{ userName }}</p>
          <div class="d-flex align-items-center gap-1">
            <span class="status-dot bg-success"></span>
            <span class="text-muted fw-medium text-uppercase tracking-wider" style="font-size: 0.65rem;">Active Driver</span>
          </div>
        </div>
        <i class="bi bi-chevron-down text-muted small me-1"></i>
      </div>

      <ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg premium-dropdown p-2 mt-2">
        <li>
          <a class="dropdown-item d-flex align-items-center gap-3 py-2.5 rounded-3" routerLink="profile">
            <div class="dropdown-icon bg-primary bg-opacity-10 text-primary">
              <i class="bi bi-person-badge"></i>
            </div>
            <div class="flex-grow-1">
              <p class="mb-0 fw-bold">My Profile</p>
              <p class="mb-0 text-xs text-muted">Vehicle & personal info</p>
            </div>
          </a>
        </li>
        <li><hr class="dropdown-divider opacity-50 mx-2"></li>
        <li>
          <a class="dropdown-item d-flex align-items-center gap-3 py-2.5 rounded-3 text-danger" href="javascript:void(0)" (click)="logout()">
            <div class="dropdown-icon bg-danger bg-opacity-10 text-danger">
              <i class="bi bi-box-arrow-right"></i>
            </div>
            <div class="flex-grow-1">
              <p class="mb-0 fw-bold">Sign Out</p>
              <p class="mb-0 text-xs text-danger opacity-75">Securely end session</p>
            </div>
          </a>
        </li>
      </ul>
    </div>
  </div>
</header>
