<div class="driver-layout-container" [class.sidebar-collapsed]="isSidebarCollapsed">
  <aside class="sidebar-wrapper">
    <app-driver-sidebar [isCollapsed]="isSidebarCollapsed"></app-driver-sidebar>
    <button class="sidebar-toggle-btn d-none d-lg-flex" (click)="toggleSidebar()">
      <i class="bi" [class.bi-chevron-left]="!isSidebarCollapsed" [class.bi-chevron-right]="isSidebarCollapsed"></i>
    </button>
  </aside>

  <div class="main-wrapper">
    <app-driver-header
      class="sticky-top"
      (toggleSidebar)="toggleSidebar()"
      [undeliveredCount]="undeliveredCount">
    </app-driver-header>

    <main class="content-body">
      <div class="content-scroll-container">
        <router-outlet></router-outlet>
      </div>
    </main>

    <app-driver-footer></app-driver-footer>
  </div>

  <div class="sidebar-overlay d-lg-none" (click)="toggleSidebar()" *ngIf="!isSidebarCollapsed"></div>
</div>
