<div class="container-fluid py-4">
  <div class="page-header">
    <h1 class="page-title">Shipping Dashboard</h1>
    <div class="d-flex gap-2">
      <button class="btn btn-premium-outline"><i class="bi bi-download me-2"></i>Export</button>
      <button class="btn btn-premium" routerLink="../shipments"><i class="bi bi-plus-lg me-2"></i>New Shipment</button>
    </div>
  </div>

  <!-- Stats Row -->
  <div class="row g-4 mb-4">
    <div class="col-12 col-sm-6 col-xl-3" *ngFor="let stat of stats">
      <div class="premium-card h-100 stat-card">
        <div class="premium-card-body">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <p class="text-muted-custom fw-medium mb-1">{{ stat.title }}</p>
              <h3 class="mb-0 fw-bold">{{ stat.value }}</h3>
            </div>
            <div class="stat-icon bg-primary bg-opacity-10 text-primary rounded-circle p-3">
              <i class="bi {{ stat.icon }} fs-4"></i>
            </div>
          </div>
          <div class="mt-3">
            <span class="fw-medium text-sm" [ngClass]="stat.trendUp ? 'text-success' : 'text-danger'">
              <i class="bi" [ngClass]="stat.trendUp ? 'bi-arrow-up-right' : 'bi-arrow-down-right'"></i> {{ stat.trend }}
            </span>
            <span class="text-muted-custom text-sm ms-2">vs last month</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <!-- Chart Column -->
    <div class="col-12 col-lg-8">
      <div class="premium-card h-100">
        <div class="premium-card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0 fw-semibold">Revenue Overview</h5>
          <select class="form-select form-select-sm w-auto border-0 bg-light">
            <option>Last 6 Months</option>
            <option>This Year</option>
          </select>
        </div>
        <div class="premium-card-body">
          <div class="chart-container" style="position: relative; height:300px;">
            <canvas #revenueChart></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Recent Shipments Column -->
    <div class="col-12 col-lg-4">
      <div class="premium-card h-100">
        <div class="premium-card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0 fw-semibold">Recent Shipments</h5>
          <a routerLink="../shipments" class="text-primary text-decoration-none text-sm fw-medium">View All</a>
        </div>
        <div class="premium-card-body p-0">
          <div class="list-group list-group-flush">
            <div class="list-group-item px-4 py-3" *ngFor="let shipment of recentShipments">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="fw-semibold">#SHP-{{ shipment.id }}</span>
                <span class="status-badge" 
                      [ngClass]="{
                        'status-success': shipment.shipmentStatus === ShipmentStatusEnum.Delivered,
                        'status-warning': shipment.shipmentStatus === ShipmentStatusEnum.Pending || shipment.shipmentStatus === ShipmentStatusEnum.ReadyForPickup,
                        'status-info': shipment.shipmentStatus === ShipmentStatusEnum.InTransit
                      }">
                  {{ ShipmentStatusEnum[shipment.shipmentStatus] }}
                </span>
              </div>
              <div class="d-flex justify-content-between text-muted-custom text-sm">
                <span><i class="bi bi-geo-alt me-1"></i>{{ shipment.deliveryCity }}</span>
                <span><i class="bi bi-person me-1"></i>{{ shipment.driverName || 'Unassigned' }}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
