<div class="container mt-4">

  <h3 class="mb-4">Add Product</h3>

  <!-- STEP 1 -->
  <div *ngIf="currentStep === 1">

    <input class="form-control mb-2" placeholder="Product Name" [(ngModel)]="name">
    <textarea class="form-control mb-2" placeholder="Description" [(ngModel)]="description"></textarea>

    <div class="row">
      <div class="col">
        <select class="form-select mb-2" [(ngModel)]="targetAudience">
          <option [value]="1">Men</option>
          <option [value]="2">Women</option>
          <option [value]="3">Kids</option>
        </select>
      </div>

      <div class="col">
        <input type="number" class="form-control mb-2" placeholder="Price" [(ngModel)]="price">
      </div>
    </div>

    <select class="form-select mb-2" [(ngModel)]="categoryId">
      <option *ngFor="let cat of categories" [value]="cat.id">
        {{ cat.name }}
      </option>
    </select>

    <select class="form-select mb-2" [(ngModel)]="dressStyle">
      <option [value]="1">Casual</option>
      <option [value]="2">Formal</option>
      <option [value]="3">Sport</option>
    </select>

    <!-- Sizes -->
    <table class="table table-bordered text-center">
      <tr>
        <th>Size</th><th>A</th><th>B</th><th>C</th>
      </tr>

      <tr *ngFor="let s of sizes; let i = index">
        <td>{{ s.name }}</td>
        <td><input class="form-control" [(ngModel)]="sizes[i].a"></td>
        <td><input class="form-control" [(ngModel)]="sizes[i].b"></td>
        <td><input class="form-control" [(ngModel)]="sizes[i].c"></td>
      </tr>
    </table>

    <button class="btn btn-primary w-100" (click)="createProduct()">
      Next
    </button>
  </div>

  <!-- STEP 2 -->
  <div *ngIf="currentStep === 2">

    <h4 class="mb-3">Product Colors</h4>

    <!-- COLORS LOOP -->
    <div *ngFor="let c of colors; let i = index" class="border p-3 mb-3">

      <input class="form-control mb-2"
             placeholder="Color Name"
             [(ngModel)]="c.colorName">

      <input type="color"
             class="form-control form-control-color mb-2"
             [(ngModel)]="c.colorCode">

      <!-- ⭐ AI TOOL IMAGE (MAIN IMAGE) -->
      <label class="fw-bold text-primary">
        AI Tool Image (Main Product Image)
      </label>

      <input type="file"
             class="form-control mb-2"
             (change)="onMainImage($event, i)">

      <input type="file"
             class="form-control mb-2"
             multiple
             (change)="onAdditionalImages($event, i)">

      <!-- Sizes per color -->
      <table class="table table-bordered text-center">
        <tr>
          <th>Size</th><th>A</th><th>B</th><th>C</th>
        </tr>

        <tr *ngFor="let s of c.sizes">
          <td>{{ s.name }}</td>
          <td><input class="form-control" [(ngModel)]="s.a"></td>
          <td><input class="form-control" [(ngModel)]="s.b"></td>
          <td><input class="form-control" [(ngModel)]="s.c"></td>
        </tr>
      </table>

      <button class="btn btn-danger btn-sm"
              (click)="removeColor(i)"
              *ngIf="colors.length > 1">
        Remove
      </button>

    </div>

    <button class="btn btn-outline-primary w-100 mb-3"
            (click)="addColor()">
      + Add Color
    </button>

    <button class="btn btn-success w-100"
            (click)="saveProduct()"
            [disabled]="isSaving">

      {{ isSaving ? 'Saving...' : 'Save Product' }}

    </button>

    <div *ngIf="successMessage" class="alert alert-success mt-3 text-center">
      {{ successMessage }}
    </div>

  </div>

</div>
