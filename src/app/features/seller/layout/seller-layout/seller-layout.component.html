<div class="wc-seller-shell min-vh-100">
  <aside class="wc-seller-sidebar border-end">
    <div class="wc-seller-brand d-flex flex-column mb-3">
      <span class="fw-bold fs-5 lh-sm">WearCast</span>
      <small>Seller portal</small>
    </div>
    <nav class="d-flex flex-column gap-1">
      <a routerLink="dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-pill">
        <i class="bi bi-speedometer2"></i> Dashboard
      </a>
      <a routerLink="profile" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-pill">
        <i class="bi bi-person-circle"></i> Profile
      </a>
      <a routerLink="products" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-pill">
        <i class="bi bi-box-seam"></i> Products
      </a>
      <a routerLink="add-product" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-pill">
        <i class="bi bi-plus-circle"></i> Add Product
      </a>
      <a routerLink="orders" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-pill">
        <i class="bi bi-bag-check"></i> Orders
      </a>
      <!-- <a routerLink="inventory" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-pill">
        <i class="bi bi-clipboard-data"></i> Inventory
      </a>
      <a routerLink="analytics" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-pill">
        <i class="bi bi-bar-chart-line"></i> Analytics
      </a> -->
    </nav>
    <button type="button" class="btn btn-sm text-white border border-light border-opacity-25 mt-auto w-100" (click)="logout()">
      <i class="bi bi-box-arrow-right me-1"></i> Sign out
    </button>
  </aside>
  <main class="wc-seller-main">
    <div class="container-fluid py-3 px-3 px-lg-4">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
