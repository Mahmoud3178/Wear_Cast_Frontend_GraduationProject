<header class="wc-nav">
  <div class="wc-nav-inner">
    <div class="wc-brand">
      <a routerLink="/customer/home" class="wc-logo">WearCast</a>
    </div>

    <nav class="wc-links" aria-label="Main navigation">
      <a routerLink="/customer/home" routerLinkActive="active">Home</a>
      <a routerLink="/customer/category" routerLinkActive="active">Products</a>
      <a routerLink="/customer/design" routerLinkActive="active">Create design</a>
    </nav>

    <div class="wc-actions">
      <div class="wc-search">
        <input
          type="search"
          placeholder="Search for products..."
          aria-label="Search for products"
          [(ngModel)]="searchTerm"
          (keyup.enter)="runSearch()"
        >
      </div>
      <a
        *ngIf="!auth.isLoggedIn()"
        routerLink="/login"
        class="wc-nav-auth wc-nav-auth--primary"
      >Log in</a>
      <button
        *ngIf="auth.isLoggedIn()"
        type="button"
        class="wc-nav-auth"
        (click)="signOut()"
      >Sign out</button>
      <a routerLink="/customer/favourites" class="wc-icon-btn" aria-label="Favourites" *ngIf="auth.isLoggedIn()">
        <span class="wc-icon">♡</span>
      </a>
      <a routerLink="/customer/cart" class="wc-icon-btn" aria-label="Cart">
        <span class="wc-icon">🛒</span>
      </a>
      <a routerLink="/customer/profile" class="wc-icon-btn" aria-label="Account">
        <span class="wc-icon">👤</span>
      </a>
    </div>
  </div>
</header>
