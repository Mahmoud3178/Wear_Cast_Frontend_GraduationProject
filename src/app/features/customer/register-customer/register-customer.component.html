<div class="container mt-5">
  <div class="card shadow p-4">
    <h3 class="text-center mb-4">Customer Register</h3>

    <form (ngSubmit)="register()">

      <!-- Name -->
      <div class="row">
        <div class="col-md-6 mb-3">
          <label>First Name</label>
          <input type="text" class="form-control" [(ngModel)]="form.firstName" name="firstName" required>
        </div>

        <div class="col-md-6 mb-3">
          <label>Last Name</label>
          <input type="text" class="form-control" [(ngModel)]="form.lastName" name="lastName" required>
        </div>
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label>Email</label>
        <input type="email" class="form-control" [(ngModel)]="form.email" name="email" required>
      </div>

      <!-- Phone -->
      <div class="mb-3">
        <label>Phone Number</label>
        <input type="text" class="form-control" [(ngModel)]="form.phoneNumber" name="phoneNumber">
      </div>

      <!-- Password -->
      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Password</label>
          <input type="password" class="form-control" [(ngModel)]="form.password" name="password" required>
        </div>

        <div class="col-md-6 mb-3">
          <label>Confirm Password</label>
          <input type="password" class="form-control" [(ngModel)]="form.confirmPassword" name="confirmPassword" required>
        </div>
      </div>

      <!-- Image -->
      <div class="mb-3">
        <label>Profile Image</label>
        <input type="file" class="form-control" (change)="onFileChange($event)">
      </div>

      <!-- Address -->
      <div class="row">
        <div class="col-md-6 mb-3">
          <label>State</label>
          <input type="text" class="form-control" [(ngModel)]="form.state" name="state">
        </div>

        <div class="col-md-6 mb-3">
          <label>City</label>
          <input type="text" class="form-control" [(ngModel)]="form.city" name="city">
        </div>
      </div>

      <div class="row">
        <div class="col-md-8 mb-3">
          <label>Street</label>
          <input type="text" class="form-control" [(ngModel)]="form.street" name="street">
        </div>

        <div class="col-md-4 mb-3">
          <label>Building No.</label>
          <input type="text" class="form-control" [(ngModel)]="form.buildingNumber" name="buildingNumber">
        </div>
      </div>

      <!-- Submit -->
      <button class="btn btn-primary w-100">Register</button>

    </form>
  </div>
</div>
