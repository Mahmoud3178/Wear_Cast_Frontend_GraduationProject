<div class="wc-factory-auth-bg min-vh-100 d-flex align-items-center justify-content-center px-3 py-4">
  <div class="card wc-factory-auth-panel border-0 w-100" style="max-width: 400px;">
    <div class="card-body p-4 p-md-5">
      <h1 class="h4 fw-bold text-center mb-1">Factory sign in</h1>
      <p class="text-center text-muted small mb-4">WearCast production portal</p>

      <div *ngIf="errorMessage" class="alert alert-danger py-2 small" role="alert">
        {{ errorMessage }}
      </div>

      <div *ngIf="emailNotConfirmed" class="alert alert-light border py-2 small mb-3" role="status">
        <p class="small text-muted mb-2">
          Confirm your email with the code WearCast sent you, then try signing in again.
        </p>
        <a
          class="btn btn-primary btn-sm w-100 mb-2"
          [routerLink]="['/confirm-email/factory-manager']"
          [queryParams]="form.email ? { email: form.email } : {}">
          Enter confirmation code
        </a>
        <button
          type="button"
          class="btn btn-outline-secondary btn-sm w-100"
          [disabled]="resendSubmitting || !form.email"
          (click)="resendConfirmation()">
          {{ resendSubmitting ? 'Sending…' : 'Resend email' }}
        </button>
      </div>

      <div *ngIf="resendInfoMessage" class="alert alert-info py-2 small mb-3" role="status">
        {{ resendInfoMessage }}
      </div>

      <form (ngSubmit)="login()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" name="email" [(ngModel)]="form.email" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input class="form-control" [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="form.password" required autocomplete="current-password">
            <button type="button" class="btn btn-outline-secondary" (click)="showPassword = !showPassword" tabindex="-1" aria-label="Toggle password visibility">
              <i class="bi" [class.bi-eye]="showPassword" [class.bi-eye-slash]="!showPassword"></i>
            </button>
          </div>
          <div class="d-flex justify-content-end mt-1 mb-3">
            <a routerLink="/forgot-password" class="text-decoration-none small text-muted">Forgot password?</a>
          </div>
        </div>
        <button type="submit" class="btn btn-dark w-100" [disabled]="submitting">
          {{ submitting ? 'Signing in…' : 'Sign in' }}
        </button>

      </form>

      <p class="text-center small text-muted mt-4 mb-0">
        <a routerLink="/login" class="text-decoration-none">Customer / seller login</a>
      </p>
    </div>
  </div>
</div>
