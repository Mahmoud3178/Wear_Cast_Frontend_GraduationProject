<div class="wc-factory-auth-bg min-vh-100 d-flex align-items-center justify-content-center px-3 py-4">
  <div class="card wc-factory-auth-panel border-0 w-100" style="max-width: 400px;">
    <div class="card-body p-4 p-md-5">
      <h1 class="h4 fw-bold text-center mb-1">Factory sign in</h1>
      <p class="text-center text-muted small mb-4">WearCast production portal</p>

      <div *ngIf="errorMessage" class="alert alert-danger py-2 small" role="alert">
        {{ errorMessage }}
      </div>

      <form (ngSubmit)="login()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" name="email" [(ngModel)]="form.email" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input class="form-control" [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="form.password" required autocomplete="current-password">
            <button type="button" class="btn btn-outline-secondary" (click)="showPassword = !showPassword" tabindex="-1" aria-label="Toggle password visibility">
              <i class="bi" [class.bi-eye]="showPassword" [class.bi-eye-slash]="!showPassword"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-dark w-100" [disabled]="submitting">
          {{ submitting ? 'Signing in…' : 'Sign in' }}
        </button>

        <div class="mt-4 pt-3 border-top">
          <label class="form-label d-block mb-2 fw-semibold">Sign in as</label>
          <div class="d-flex gap-2 flex-wrap">
            <input
              type="radio"
              class="btn-check"
              name="accountType"
              id="account-type-factory"
              value="factory"
              [(ngModel)]="accountType"
            >
            <label class="btn btn-outline-secondary flex-grow-1" for="account-type-factory">
              Factory
            </label>

            <input
              type="radio"
              class="btn-check"
              name="accountType"
              id="account-type-manager"
              value="manager"
              [(ngModel)]="accountType"
            >
            <label class="btn btn-outline-secondary flex-grow-1" for="account-type-manager">
              Factory Manager
            </label>
          </div>
          <small class="text-muted d-block mt-2">
            This controls which profile experience opens after sign in.
          </small>
        </div>
      </form>

      <p class="text-center small text-muted mt-4 mb-0">
        <a routerLink="/login" class="text-decoration-none">Customer / seller login</a>
        ·
        <a routerLink="/factory/register" class="text-decoration-none">Create factory</a>
      </p>
    </div>
  </div>
</div>
