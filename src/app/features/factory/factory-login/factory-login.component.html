<div class="wc-factory-auth-bg">
  <div class="card wc-factory-auth-panel w-100">
    <div class="card-body p-4 p-md-5">
      
      <div class="auth-header">
        <div class="brand-icon-wrapper" aria-hidden="true">
          <i class="bi bi-building-gear"></i>
        </div>
        <h1>Factory Sign In</h1>
        <p>WearCast Production Portal</p>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger py-2 small rounded-3 mb-4 text-center" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ errorMessage }}
      </div>

      <form (ngSubmit)="login()">
        <div class="mb-4">
          <label class="form-label" for="factory-email">Email Address</label>
          <div class="input-group">
            <span class="d-flex align-items-center ps-3 text-muted" aria-hidden="true">
              <i class="bi bi-envelope"></i>
            </span>
            <input 
              id="factory-email"
              class="form-control" 
              type="email" 
              name="email" 
              [(ngModel)]="form.email" 
              placeholder="name@factory.com"
              required 
              autocomplete="username">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="factory-password">Password</label>
          <div class="input-group">
            <span class="d-flex align-items-center ps-3 text-muted" aria-hidden="true">
              <i class="bi bi-lock"></i>
            </span>
            <input 
              id="factory-password"
              class="form-control" 
              [type]="showPassword ? 'text' : 'password'" 
              name="password" 
              [(ngModel)]="form.password" 
              placeholder="••••••••"
              required 
              autocomplete="current-password">
            <button type="button" class="btn btn-outline-secondary" (click)="showPassword = !showPassword" tabindex="-1" aria-label="Toggle password visibility">
              <i class="bi" [class.bi-eye]="showPassword" [class.bi-eye-slash]="!showPassword"></i>
            </button>
          </div>
          <div class="d-flex justify-content-end mt-2">
            <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
          </div>
        </div>

        <button type="submit" class="btn btn-submit btn-dark w-100" [disabled]="submitting">
          <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          {{ submitting ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>

      <div class="portal-switch">
        <a routerLink="/login">
          <i class="bi bi-arrow-left"></i>
          Customer / Seller portal
        </a>
      </div>
    </div>
  </div>
</div>
