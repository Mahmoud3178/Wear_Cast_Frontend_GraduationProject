<div class="wc-factory-shell factory-shell min-vh-100">
  <aside class="wc-factory-sidebar border-end">
    <div class="wc-factory-brand d-flex flex-column mb-3">
      <span class="fw-bold fs-5 lh-sm">WearCast</span>
      <small>Factory portal</small>
    </div>
    <nav class="d-flex flex-column gap-1">
      <a routerLink="/factory/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-pill"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a routerLink="/factory/products" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-pill"><i class="bi bi-box-seam"></i> Products</a>
      <a routerLink="/factory/orders" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-pill"><i class="bi bi-cart-check"></i> Orders</a>
      <a routerLink="/factory/products/new" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-pill"><i class="bi bi-plus-circle"></i> New product</a>
      <a routerLink="/factory/profile" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-pill"><i class="bi bi-person-gear"></i> Profile</a>
      <a routerLink="/factory/managers" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-pill"><i class="bi bi-people"></i> Managers</a>
    </nav>
    <button type="button" class="btn btn-sm text-white border border-light border-opacity-25 mt-auto w-100" (click)="logout()">
      <i class="bi bi-box-arrow-right me-1"></i> Sign out
    </button>
  </aside>
  <main class="wc-factory-main">
    <div class="container-fluid py-3 px-3 px-lg-4">
      <router-outlet />
    </div>
  </main>
</div>
