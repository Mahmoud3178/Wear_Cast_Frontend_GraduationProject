<div class="wc-factory-shell factory-shell d-flex flex-column min-vh-100">
  <header class="wc-factory-header factory-header border-bottom">
    <div class="container-fluid py-3 px-3 px-lg-4 d-flex flex-wrap align-items-center justify-content-between gap-3">
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <div class="wc-factory-brand d-flex flex-column">
          <span class="fw-bold fs-5 lh-sm">WearCast</span>
          <small>Factory portal</small>
        </div>
        <nav class="d-flex gap-1 flex-wrap align-items-center">
          <a routerLink="/factory/dashboard" routerLinkActive="active" class="nav-pill"><i class="bi bi-speedometer2"></i> Dashboard</a>
          <a routerLink="/factory/products" routerLinkActive="active" class="nav-pill"><i class="bi bi-box-seam"></i> Products</a>
          <a routerLink="/factory/orders" routerLinkActive="active" class="nav-pill"><i class="bi bi-cart-check"></i> Orders</a>
          <a routerLink="/factory/products/new" routerLinkActive="active" class="nav-pill"><i class="bi bi-plus-circle"></i> New product</a>
          <a routerLink="/factory/profile" routerLinkActive="active" class="nav-pill"><i class="bi bi-person-gear"></i> Profile</a>
          <a routerLink="/factory/managers" routerLinkActive="active" class="nav-pill"><i class="bi bi-people"></i> Managers</a>
        </nav>
      </div>
      <button type="button" class="btn btn-sm text-white border border-light border-opacity-25" (click)="logout()">
        <i class="bi bi-box-arrow-right me-1"></i> Sign out
      </button>
    </div>
  </header>
  <main class="wc-factory-main flex-grow-1">
    <router-outlet />
  </main>
</div>
