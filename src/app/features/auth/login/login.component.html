<div class="vh-100 d-flex justify-content-center align-items-center bg-light">

  <div class="card shadow-lg p-4" style="width: 350px; border-radius: 15px;">

    <!-- 🔹 Title -->
    <div class="text-center mb-4">
      <h3 class="fw-bold">Welcome Back 👋</h3>
      <p class="text-muted">Login to your account</p>
    </div>

    <!-- 🔹 Form -->
    <form (ngSubmit)="login()">

      <div *ngIf="errorMessage" class="alert alert-danger py-2 small" role="alert">
        {{ errorMessage }}
      </div>

      <div *ngIf="emailNotConfirmed" class="alert alert-light border py-2 small mb-3" role="status">
        <p class="small text-muted mb-2">
          Confirm your email with the code WearCast sent you, then try signing in again.
        </p>
        <a
          class="btn btn-primary btn-sm w-100 mb-2"
          [routerLink]="['/confirm-email/customer']"
          [queryParams]="form.email ? { email: form.email } : {}">
          Enter confirmation code
        </a>
        <button
          type="button"
          class="btn btn-outline-secondary btn-sm w-100"
          [disabled]="resendSubmitting || !form.email"
          (click)="resendConfirmation()">
          {{ resendSubmitting ? 'Sending…' : 'Resend email' }}
        </button>
      </div>

      <div *ngIf="resendInfoMessage" class="alert alert-info py-2 small mb-0" role="status">
        {{ resendInfoMessage }}
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email"
               class="form-control"
               placeholder="Enter your email"
               [(ngModel)]="form.email"
               name="email"
               required>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input [type]="showPassword ? 'text' : 'password'"
                 class="form-control"
                 placeholder="Enter your password"
                 [(ngModel)]="form.password"
                 name="password"
                 required>
          <button type="button" class="btn btn-outline-secondary" (click)="showPassword = !showPassword" tabindex="-1" aria-label="Toggle password visibility">
            <i class="bi" [class.bi-eye]="showPassword" [class.bi-eye-slash]="!showPassword"></i>
          </button>
        </div>
      </div>

      <!-- Login Button -->
      <button type="submit" class="btn btn-dark w-100 mb-3" [disabled]="submitting">
        {{ submitting ? 'Signing in…' : 'Login' }}
      </button>

    </form>

    <!-- 🔹 Register Links -->
    <div class="text-center">

      <small>
        Don't have an account?
        <a routerLink="/customer/register" class="text-decoration-none">
          Customer
        </a>
        |
        <a routerLink="/seller/register" class="text-decoration-none">
          Seller
        </a>
      </small>

      <p class="text-center small mt-3 mb-0 text-muted">
        <a
          [routerLink]="['/confirm-email/customer']"
          [queryParams]="form.email ? { email: form.email } : {}"
          class="text-decoration-none">
          Enter customer email code
        </a>
        <span class="mx-1">·</span>
        <a routerLink="/confirm-email/seller" class="text-decoration-none">
          Enter seller email code
        </a>
        <span class="mx-1">·</span>
        <a routerLink="/factory/login" class="text-decoration-none">Factory</a>
      </p>

    </div>

  </div>

</div>
