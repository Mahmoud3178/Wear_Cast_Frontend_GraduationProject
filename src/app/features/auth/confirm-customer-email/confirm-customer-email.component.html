<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light py-5 px-3">
  <div class="card shadow-lg border-0 w-100" style="max-width: 420px; border-radius: 16px;">
    <div class="card-body p-4 p-md-5">
      <h1 class="h4 fw-bold text-center mb-2">Confirm your email</h1>
      <p class="text-center text-muted small mb-4">
        Enter the verification code WearCast sent to <span class="fw-medium text-dark">{{ email }}</span>
      </p>

      <div *ngIf="errorMessage" class="alert alert-danger py-2 small" role="alert">
        {{ errorMessage }}
      </div>
      <div *ngIf="successMessage" class="alert alert-success py-2 small" role="alert">
        {{ successMessage }}
      </div>

      <!-- Hidden user ID -->
      <input type="hidden" [(ngModel)]="userId" name="userId">



      <div class="mb-3">
        <label class="form-label">Verification code</label>
        <input
          type="text"
          class="form-control form-control-lg text-center tracking-wider font-monospace"
          style="letter-spacing: 0.35em;"
          [ngModel]="code"
          (ngModelChange)="onCodeInput($event)"
          name="code"
          inputmode="numeric"
          autocomplete="one-time-code"
          placeholder="000000"
          maxlength="8">
      </div>

      <button
        type="button"
        class="btn btn-dark w-100 py-2 mb-2"
        [disabled]="submitting"
        (click)="confirm()">
        {{ submitting ? 'Verifying…' : 'Confirm email' }}
      </button>



      <p class="text-center small text-muted mb-2">
        <a routerLink="/login" class="text-decoration-none">Back to sign in</a>
        ·
        <a routerLink="/customer/register" class="text-decoration-none">Register</a>
      </p>
    </div>
  </div>
</div>
