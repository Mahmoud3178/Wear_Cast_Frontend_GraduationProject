<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light py-5 px-3">
  <div class="card shadow-lg border-0 w-100" style="max-width: 420px; border-radius: 16px;">
    <div class="card-body p-4 p-md-5">
      <h3 class="text-center fw-bold mb-2">Reset Password</h3>
      <p class="text-center text-muted small mb-4">
        Enter the verification code sent to your email and your new password.
      </p>

      <div *ngIf="errorMessage" class="alert alert-danger py-2 small" role="alert">
        {{ errorMessage }}
      </div>
      <div *ngIf="successMessage" class="alert alert-success py-2 small" role="alert">
        {{ successMessage }}
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control form-control-lg" [(ngModel)]="form.email" name="email" placeholder="Enter your email" required readonly>
      </div>

      <div class="mb-3">
        <label class="form-label">Verification Code</label>
        <input type="text" class="form-control form-control-lg text-center tracking-wider font-monospace" style="letter-spacing: 0.35em;" [(ngModel)]="form.code" name="code" placeholder="000000" maxlength="8" required>
      </div>

      <div class="mb-3">
        <label class="form-label">New Password</label>
        <div class="input-group">
          <input [type]="showNewPassword ? 'text' : 'password'" class="form-control form-control-lg" [(ngModel)]="form.newPassword" name="newPassword" placeholder="Enter new password" required>
          <button type="button" class="btn btn-outline-secondary" (click)="showNewPassword = !showNewPassword" tabindex="-1" aria-label="Toggle new password visibility">
            <i class="bi" [class.bi-eye]="showNewPassword" [class.bi-eye-slash]="!showNewPassword"></i>
          </button>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm New Password</label>
        <div class="input-group">
          <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control form-control-lg" [(ngModel)]="form.confirmNewPassword" name="confirmNewPassword" placeholder="Confirm new password" required>
          <button type="button" class="btn btn-outline-secondary" (click)="showConfirmPassword = !showConfirmPassword" tabindex="-1" aria-label="Toggle confirm password visibility">
            <i class="bi" [class.bi-eye]="showConfirmPassword" [class.bi-eye-slash]="!showConfirmPassword"></i>
          </button>
        </div>
      </div>

      <button
        type="button"
        class="btn btn-dark w-100 py-2 mb-3"
        [disabled]="submitting"
        (click)="submit()">
        {{ submitting ? 'Resetting...' : 'Reset Password' }}
      </button>

      <p class="text-center small text-muted mb-0">
        <a routerLink="/login" class="text-decoration-none">Back to sign in</a>
      </p>
    </div>
  </div>
</div>
