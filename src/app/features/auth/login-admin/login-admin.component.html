<div class="vh-100 d-flex justify-content-center align-items-center bg-light">

  <div class="card shadow-lg p-4" style="width: 350px; border-radius: 15px;">

    <!-- Title -->
    <div class="text-center mb-4">
      <h3 class="fw-bold text-danger">Admin Panel 🔐</h3>
      <p class="text-muted">Login as Administrator</p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="login()">

      <div *ngIf="errorMessage" class="alert alert-danger py-2 small">
        {{ errorMessage }}
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email"
               class="form-control"
               [(ngModel)]="form.email"
               name="email"
               required>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password"
               class="form-control"
               [(ngModel)]="form.password"
               name="password"
               required>
      </div>

      <!-- Button -->
      <button type="submit"
              class="btn btn-danger w-100"
              [disabled]="submitting">

        {{ submitting ? 'Signing in...' : 'Login as Admin' }}
      </button>

    </form>

  </div>

</div>
