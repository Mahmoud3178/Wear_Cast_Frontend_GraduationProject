<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light px-3 py-5">
  <div class="card border-0 shadow-sm w-100" style="max-width: 400px; border-radius: 12px;">
    <div class="card-body p-4 p-sm-5 text-center">
      <h1 class="h4 fw-bold mb-2">Resend Confirmation</h1>
      <p class="text-muted small mb-4">
        Enter your email address to receive a new verification code.
      </p>

      <div *ngIf="errorMessage" class="alert alert-danger py-2 small text-start">
        {{ errorMessage }}
      </div>
      <div *ngIf="successMessage" class="alert alert-success py-2 small text-start">
        {{ successMessage }}
      </div>

      <form (ngSubmit)="resend()">
        <div class="mb-4 text-start">
          <label class="form-label small fw-medium">Email</label>
          <input
            type="email"
            class="form-control bg-light"
            name="email"
            [(ngModel)]="email"
            placeholder="you@example.com"
            required>
        </div>

        <button type="submit" class="btn btn-dark w-100 mb-3" [disabled]="submitting || !email">
          <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          {{ submitting ? 'Sending...' : 'Resend Code' }}
        </button>
      </form>

      <div class="mt-4">
        <a [routerLink]="type === 'factory-manager' ? '/factory/login' : '/login'" class="text-decoration-none small text-muted">
          Back to sign in
        </a>
      </div>
    </div>
  </div>
</div>
